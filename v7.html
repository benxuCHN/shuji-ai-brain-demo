function current(){return fixtures[state.site]}
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('visible');clearTimeout(lastToast);lastToast=setTimeout(()=>$('#toast').classList.remove('visible'),2600)}
function picker(){return `<div class="page-controls"><span class="date-label">2026.08.30 · 16:30</span><label class="scope">${icon('scope')}<span class="sr-only">景区</span><select id="site">${['A','B','C'].map(x=>`<option value="${x}" ${state.site===x?'selected':''}>景区${x}</option>`).join('')}</select></label></div>`}
function title(name,sub,controls=true){return `<div class="page-title"><div><h1>${name}</h1><p class="page-lead">${sub}</p></div>${controls?picker():'<span class="tag">18份工作簿已核查</span>'}</div>`}
function delta(key){const d=current(),p=percent(d[key],d[key+'Prev']);if(d[key]===null)return '<span class="delta warning">当日未齐 · 不计入汇总</span>';if(p===null)return '<span class="delta neutral">无可比基数</span>';return `<span class="delta ${p>0?'good':p<0?'bad':'neutral'}">${p>0?'↑':p<0?'↓':'—'} ${Math.abs(p).toFixed(1)}%</span><span> 较上周同日同时段</span>`}
function analyze(site=state.site){const d=fixtures[site],out=[];
 if(d.refundPrev>0&&d.refund>=1000&&percent(d.refund,d.refundPrev)>=50)out.push({id:'refund',kind:'business',tag:'退款异常',tone:'amber',title:'退款金额明显增加',summary:`${fmt(d.refund)}元，较上周同日同时段增加${percent(d.refund,d.refundPrev).toFixed(0)}%。先核对退款原因与原订单。`,values:[['当日退款金额',fmt(d.refund)+'元'],['上周同日',fmt(d.refundPrev)+'元']],facts:[`本日成功退款${d.refundN}笔，发生额${fmt(d.refund)}元。`,`比较日退款金额${fmt(d.refundPrev)}元，增加${fmt(d.refund-d.refundPrev)}元。`],hypothesis:'原因可能涉及退款规则、临时取消或数据回补。现有汇总无法确认原因，也无法判断是否集中于某个销售渠道。',rule:'退款额≥1,000元，且较可比日增加≥50%。仅为演示阈值，正式版需按景区历史波动校准。',source:'退款记录',fields:metrics.refund.fields,recommended:'核查退款明细和主要原因',action:'由票务负责人核对成功退款流水、原订单和原因，分清正常退款、重复退款及数据问题，再决定是否调整规则。',alternative:'继续观察两个营业日',altAction:'记录本次波动，保持现有规则；补齐按相同规则统计数据后再次分析。',acceptance:'形成退款原因分类与待处理清单，保留原流水依据，不预设必须限制退款。'});
 if(d.paidPrev>0&&percent(d.paid,d.paidPrev)<=-8)out.push({id:'paid',kind:'business',tag:'交易变化',tone:'amber',title:'门票收款下降，入园检票次数却上升',summary:`收款金额下降${Math.abs(percent(d.paid,d.paidPrev)).toFixed(1)}%，检票次数${percent(d.entry,d.entryPrev)>=0?'增加':'下降'}${Math.abs(percent(d.entry,d.entryPrev)).toFixed(1)}%。两者需要分别核查。`,values:[['门票收款',fmt(d.paid)+'元'],['入园检票次数',fmt(d.entry)+'次']],facts:[`门票收款${fmt(d.paid)}元，对比日${fmt(d.paidPrev)}元。`,`当日检票${fmt(d.entry)}次，对比日${fmt(d.entryPrev)}次。`,`当日支付订单${d.orders}单，对比日${d.ordersPrev}单。`],hypothesis:'当日购买和当日入园可能不是同一批游客。预售使用、票型结构或渠道变化都需要进一步验证，不能据此直接认定客单价下降。',rule:'收款金额较可比日下降≥8%，同时核查入园变化。演示阈值不作为正式经营标准。',source:'主订单、入园记录',fields:['actual_pay_fee','pay_time','order_channel','distribution_id','ticket_no','create_time'],recommended:'拆分购买日与游玩日，核查差额',action:'由运营负责人查看同一购票批次的票型与渠道构成，并补齐订单到门票的关联，解释收款变化。',alternative:'先补齐订单关联，再分析',altAction:'将订单号映射和历史明细交给数据负责人核对，资料齐备后重算。',acceptance:'按统一口径解释收款差额；明确当日售票与历史预售的使用贡献。'});
 if(d.posPrev>0&&percent(d.pos,d.posPrev)<=-15)out.push({id:'pos',kind:'business',tag:'园内消费',tone:'amber',title:'园内消费收款下降，需要查看店铺变化',summary:`实收${fmt(d.pos)}元，较上周同日同时段下降${Math.abs(percent(d.pos,d.posPrev)).toFixed(1)}%。`,values:[['园内消费收款',fmt(d.pos)+'元'],['成功收银订单',d.posN+'单']],facts:[`可比日实收${fmt(d.posPrev)}元，本日${fmt(d.pos)}元。`,`本日成功订单${d.posN}单，平均每笔消费${fmt(d.pos/d.posN)}元。`],hypothesis:'需核查店铺营业、收银数据完整度、订单数量与退款变化。没有关联游客身份，不能把它解释成二消转化率下降。',rule:'按相同规则统计园内消费收款较可比日下降≥15%。演示阈值。',source:'收银订单、店铺',fields:metrics.pos.fields,recommended:'核查店铺实收与营业情况',action:'对比各店铺有效收银、退款及营业记录，先排除数据缺漏，再提出商品或运营调整。',alternative:'先核对收银数据覆盖',altAction:'补齐未关联店铺、迟到支付与冲正记录，再分析业务变化。',acceptance:'说明主要差额来自哪些店铺及原因，并附可核对的明细。'});
 if(d.perf&&d.perfData&&d.perfData.checked/d.perfData.eligible*100<=d.perfData.prevRate-10){const p=d.perfData;out.push({id:'performance',kind:'business',tag:'演艺 · 有演出的景区显示',tone:'teal',title:'演出票使用率下降',summary:`可使用的票${p.eligible}张，已使用${p.checked}张，使用率${(p.checked/p.eligible*100).toFixed(0)}%。`,values:[['演出票使用率',(p.checked/p.eligible*100).toFixed(0)+'%'],['对比日比例',p.prevRate+'%']],facts:[`当日当天可使用演出票${p.eligible}张，实际使用${p.checked}张。`,`当前比例${(p.checked/p.eligible*100).toFixed(0)}%，低于可比日${p.prevRate-(p.checked/p.eligible*100)}个百分点。`],hypothesis:'场次衔接、游客提醒和数据回补均为待核实方向。这里不以全部入园游客作分母，也不等同于座位上座率。',rule:'已配置演艺且使用数据齐备，使用率较可比日下降≥10个百分点。',source:'模拟演艺票及场次扩展；原始资料尚不齐备',fields:['演出票资格','场次编号','实际使用','可比场次规则'],recommended:'核查未使用票与场次衔接',action:'运营人员按场次核对未使用原因，确认后选择提醒、动线或场次调整方案。',alternative:'先确认可使用的票口径',altAction:'核对赠票、改期、退款及套票资格，修正分母后再作判断。',acceptance:'按场次提交可使用与实际使用对照、原因及改进建议。'})}
 if(d.parking===null)out.push({id:'parking-data',kind:'data',tag:'数据待核实',tone:'',title:'停车数据与交易数据相差一天',summary:'停车资料截至08/29，当前看板为08/30。停车金额暂不进入当日汇总。',values:[['看板日期','08/30'],['停车资料日期',d.parkingDate]],facts:['当前交易演示数据为8月30日。','停车演示记录为8月29日，金额单位和收费口径须统一。'],hypothesis:'这是数据覆盖问题。不能由此判断停车收入下降或停车场没有营业。',rule:'来源日期与所选统计日不一致，则停止跨源当天汇总并提示补数。',source:'停车入场、出场、收费',fields:['entrance_time','exit_time','pay_time'],recommended:'补齐当日停车数据',action:'由数据负责人核对导出日期、入出场范围与收费字段，补齐后刷新看板。',alternative:'保持分日查看',altAction:'继续分别展示两个日期的数据，不计算跨日合计。',acceptance:'完成当日停车记录导入和口径确认，再恢复同日展示。'});
 return out;
}
function key(id){return state.site+':'+id}
function kpi(k){const d=current(),m=metrics[k];return `<button class="kpi-card ${state.metric===k?'selected':''}" data-metric="${k}"><div class="kpi-top"><span>${m.name}</span><span>↗</span></div><strong class="kpi-number">${d[k]===null?'—':fmt(d[k])}<small>${d[k]===null?'':m.unit}</small></strong><div class="kpi-caption">${delta(k)}</div></button>`}
function overview(){const d=current(),aa=analyze(),business=aa.filter(a=>a.kind==='business'),quality=aa.filter(a=>a.kind==='data');return title('数据看板','景区'+state.site+' · 门票、入园、渠道、园内消费与停车')+`<div class="status-line"><span>模拟数据：08/30 截至16:30 · 对比上周同日同时段 · ${d.parking===null?'停车数据待补齐':'各项数据均已用模拟数字展示'}</span><button data-nav="data">看数字怎么算 →</button></div><div class="dashboard"><div class="overview-main"><div class="kpi-grid">${['paid','entry','orders','refund','pos','parking'].map(kpi).join('')}</div><section class="content-panel"><div class="section-head"><div><h2>${metrics[state.metric].name} · 分时变化</h2><p class="panel-desc">点击上方指标切换 · ${metrics[state.metric].unit}</p></div><div class="chart-legend"><span><i class="legend-key"></i>当前时段</span><span><i class="legend-key baseline"></i>上周同日</span></div></div>${trend(state.metric)}<div class="domain-action"><button data-definition="${state.metric}">这个数字怎么算？</button></div></section><div class="domain-grid"><section class="content-panel"><h2>渠道与订单</h2><p class="panel-desc">有效主订单收款分布</p><div class="compact-list">${d.channels.map(([n,v,c])=>`<div><div class="compact-row"><span>${n}</span><b>${fmt(v)}元</b></div><div class="mini-bar"><span style="width:${v/d.paid*100}%"></span></div><div class="list-stat">${c}单 · 占比${(v/d.paid*100).toFixed(0)}%</div></div>`).join('')}</div><div class="domain-action"><button data-domain="channels">看渠道明细 →</button></div></section><section class="content-panel"><h2>门票和检票</h2><p class="panel-desc">销售与使用分开观察</p><div class="compact-list">${d.products.map(([n,v])=>`<div class="compact-row"><span>${n} · 售出票数</span><b>${fmt(v)}张</b></div>`).join('')}<div class="compact-row"><span>首次入园检票</span><b>${fmt(d.entry)}次</b></div><div class="compact-row"><span>套票</span><span class="data-state">待接入明细</span></div></div><p class="list-stat">当日销售与当日检票不是同一批票，不直接计算转化率。</p><div class="domain-action"><button data-domain="tickets">查看门票和套票 →</button></div></section><section class="content-panel"><h2>园内消费</h2><p class="panel-desc">收银 · 按店铺归集</p><div class="compact-list">${d.shops.map(([n,v])=>`<div class="compact-row"><span>${n}</span><b>${fmt(v)}元</b></div>`).join('')}<div class="compact-row"><span>成功收银订单</span><b>${d.posN}单</b></div><div class="compact-row"><span>平均每笔消费</span><b>${fmt(d.pos/d.posN)}元</b></div></div><div class="domain-action"><button data-definition="pos">看消费金额怎么算 →</button></div></section><section class="content-panel"><h2>停车经营</h2><p class="panel-desc">停车场${state.site}01 · 数据日期 ${d.parkingDate}</p><div class="compact-list"><div class="compact-row"><span>入场车次</span><b>${fmt(d.carIn)}车次</b></div><div class="compact-row"><span>出场车次</span><b>${fmt(d.carOut)}车次</b></div><div class="compact-row"><span>当天收款</span><b>${fmt(d.parkLast)}元</b></div><div class="compact-row"><span>现在停着的车</span><span class="data-state">待补期初存量</span></div></div><p class="list-stat">入出场差额不能直接当作在场车辆数。</p><div class="domain-action"><button data-definition="parking">看停车金额怎么算 →</button></div></section></div>${performancePanel()}</div><aside class="overview-aside"><div class="ai-panel"><div class="ai-header"><h2><span>✧</span> AI经营观察 <span class="tag teal">${business.length}项变化</span></h2><p>${business.length?'抓取关键指标，识别异常，再选择适合的处理方式。':'这次演示规则未发现显著变化，继续观察数据完整度。'}</p></div>${business.map(a=>`<button class="ai-anomaly" data-anomaly="${a.id}"><span class="tag ${selections[key(a.id)]?'teal':a.tone}">${selections[key(a.id)]?'已选择方案':a.tag}</span><h3>${a.title}</h3><p>${a.summary}</p><span class="text-link">看看原因和办法 →</span></button>`).join('')||'<div class="ai-anomaly"><h3>当前没有待处理经营异常</h3><p>无告警不代表没有风险；这次仅覆盖已配置指标。</p></div>'}<div class="ai-footer"><button class="primary" data-run>重新分析关键数据</button><p class="analysis-run-note">${state.lastRun?'已重新计算当前演示数据':'模拟分析结果'}</p></div></div><div class="quality-note"><strong>数据完整度</strong><p>${quality.length?quality[0].summary:'各核心专题采用同日模拟数据。原始样本的接入问题可在数据页查看。'}</p><button ${quality.length?'data-anomaly="parking-data"':'data-nav="data"'}>${quality.length?'处理数据问题':'查看原始资料核查'} →</button></div></aside></div>`}
function trend(k){const d=current();if(d[k]===null)return '<div class="module-empty">当日数据未齐，暂不生成趋势。<br>已有停车资料在下方按独立日期展示。</div>';const weights=d.times,base=[.02,.04,.07,.12,.17,.20,.17,.11,.065,.035];const actual=weights.map(x=>x*d[k]),prev=base.map(x=>x*d[k+'Prev']);const max=Math.max(...actual,...prev)*1.2;const W=620,H=235,L=52,R=14,T=20,B=35;const x=i=>L+i*(W-L-R)/9,y=v=>H-B-v/max*(H-T-B);const line=a=>a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ');return `<svg class="trend-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${metrics[k].name}模拟分时趋势，当前日总计${d[k]}，对比日${d[k+'Prev']}，单位${metrics[k].unit}">${[0,.5,1].map(f=>`<line x1="${L}" x2="${W-R}" y1="${y(f*max)}" y2="${y(f*max)}" stroke="#eaf0f3"/><text x="${L-10}" y="${y(f*max)+4}" text-anchor="end" fill="#91a4ae" font-size="12">${Math.round(f*max).toLocaleString()}</text>`).join('')}<path d="${line(prev)}" fill="none" stroke="#bccad1" stroke-width="2" stroke-dasharray="5 5"/><path d="${line(actual)}" fill="none" stroke="#328c75" stroke-width="3"/>${[0,3,6,9].map(i=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="12" fill="#8ea2ab">${i+7}:00</text>`).join('')}</svg><p class="trend-note">分时曲线为产品交互模拟，非工作簿的真实历史曲线。</p>`}
function performancePanel(){const d=current();if(!d.perf)return '';return `<section class="content-panel"><div class="optional-head"><h2>演出情况</h2><span class="tag">有演出的景区显示 · 本景区已配置</span></div>${d.perfData?`<div class="optional-stats"><div><span>当天可使用演出票</span><strong>${fmt(d.perfData.eligible)}<small>张</small></strong></div><div><span>实际使用</span><strong>${fmt(d.perfData.checked)}<small>张</small></strong></div><div><span>使用率</span><strong>${(d.perfData.checked/d.perfData.eligible*100).toFixed(0)}<small>%</small></strong></div></div><p class="list-stat">演艺数据为模拟扩展；实际接入需补齐演出票、场次与资格关系。非全体入园游客转化率。</p><div class="domain-action"><button data-anomaly="performance">查看演艺分析与建议 →</button></div>`:'<div class="module-empty">本景区已配置演艺，场次与演出票数据待接入。<br>数据齐备后再生成使用分析。</div>'}</section>`}

function sevenDayChart(a){const vals=[...a.actual,...a.baseline],lo=Math.min(...vals)*.88,hi=Math.max(...vals)*1.06,W=680,H=190,L=42,R=15,T=15,B=34;const x=i=>L+i*(W-L-R)/6,y=v=>H-B-(v-lo)/(hi-lo)*(H-T-B),path=v=>v.map((n,i)=>(i?'L':'M')+x(i)+','+y(n)).join(' ');return `<svg class="seven-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="8月24日至30日的${a.metric}模拟数据与参考值">${[lo,(lo+hi)/2,hi].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e6edf1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#7e929f">${v.toFixed(1)}</text>`).join('')}<path d="${path(a.baseline)}" fill="none" stroke="#afbdc8" stroke-width="2" stroke-dasharray="5 5"/><path d="${path(a.actual)}" fill="none" stroke="#3a7eab" stroke-width="3"/>${a.actual.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="#3a7eab"/><text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="12" fill="#7e929f">8/${24+i}</text>`).join('')}</svg>`}
function strategyPage(){const a=advisoryForSite(),choice=strategicChoices[state.site];if(!a)return title('AI出主意','持续看趋势，为经营动作排优先级')+`<div class="clear-state"><h2>这次未触发持续下滑分析</h2><p>模拟景区B整体平稳。经营建议页在发现持续变化后展示证据、可选方案与跟踪计划。</p><button class="text-link" data-nav="overview">查看经营数据 →</button></div>`;const st=sevenDayStats(a);return title('AI出主意','马上处理解决眼前问题，经营建议推动持续改善')+`<div class="advisory-layout"><div><section class="content-panel trend-evidence"><div class="section-head"><div><span class="tag blue">连续7日低于参考值</span><h2>${a.metric}</h2></div><div class="seven-total"><strong>${st.change.toFixed(1)}%</strong><span>7日合计较参考值</span></div></div>${sevenDayChart(a)}<div class="chart-caption"><span>蓝线：当前实际（模拟）</span><span>虚线：参考值（模拟）</span><span>单位：${a.unit}</span></div><details class="source-details"><summary>查看7日数值与比较口径</summary><div class="table-wrap"><table class="source-table"><thead><tr><th>日期</th><th>实际</th><th>参考值</th></tr></thead><tbody>${a.actual.map((n,i)=>`<tr><td>08/${24+i}</td><td>${n.toFixed(2)}</td><td>${a.baseline[i].toFixed(2)}</td></tr>`).join('')}</tbody></table></div><p>均为截至16:30的模拟数据。正式参考值需对齐星期、节假日、营业时段与活动背景；这些连续历史并非从原始工作簿推算。</p></details></section><section class="advisor-verdict"><span class="tag blue">AI建议你先这样做</span><h2>${a.title}</h2><p>${a.finding}</p><div class="decision-target"><strong>这次拟定目标</strong><p>${a.target}。这是试行目标，并非收益预测或保证。</p></div></section><section class="advice-options"><div class="section-head"><h2>可选择的经营方案</h2><span class="muted">按优先级排列</span></div>${a.plans.map((p,i)=>`<article class="advice-option ${i===0?'recommended':''}"><div class="decision-top"><span class="tag ${i===0?'blue':''}">${p.label}</span><span>${p.horizon} · ${p.steps.length}项执行动作</span></div><h3>${p.title}</h3><p>${p.why}</p><div class="plan-meta"><span>资源</span><p>${p.resources}</p></div><div class="plan-meta"><span>看效果</span><p>${p.checkpoint}</p></div><div class="decision-bottom"><span>${choice?.planId===p.id?'已采纳 · '+choice.taskIds.length+'项任务':''}</span><button class="${i===0?'primary':'outline'}" data-plan="${p.id}">${choice?.planId===p.id?'查看执行计划':'查看方案并选择'} →</button></div></article>`).join('')}</section></div><aside><section class="content-panel"><h2>下滑集中在哪里</h2><p class="panel-desc">7日模拟分项 · ${a.unit}</p><div class="table-wrap"><table class="source-table"><thead><tr><th>项目</th><th>实际</th><th>参考值</th><th>差额</th></tr></thead><tbody>${a.evidence.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="source-caption">分项差额用于排序，不等同于已确认原因。</p></section><section class="content-panel"><h2>目前的判断边界</h2><p class="advisor-copy">${a.hypothesis}</p></section>${choice?strategyTracking(choice):`<section class="content-panel"><h2>怎样缓解经营的不确定性</h2><div class="review-steps"><p><b>今天</b>选定一个主要方向</p><p><b>执行期</b>按责任人与节点推进</p><p><b>看效果日</b>对照目标决定继续、调整或停止</p></div></section>`}<p class="source-caption">当前使用可解释规则和预设经营方案演示，未连接在线模型。正式AI应结合景区知识、历史方案与执行结果生成建议。</p></aside></div>`}
function strategyTracking(c){const linked=tasks.filter(t=>c.taskIds.includes(t.id)),done=linked.filter(t=>t.status==='已完成').length;return `<section class="content-panel strategy-tracking"><h2>已采纳方案的跟踪</h2><h3>${esc(c.planTitle)}</h3><p>执行完成 ${done}/${linked.length} 项 · ${done===linked.length?'待评估经营效果':'推进中'}</p><p>任务完成与经营改善分别判断。</p><button class="text-link" data-nav="supervision">查看执行任务 →</button>${c.review?`<div class="quality-note"><strong>经营者填写：${esc(c.review.result)}</strong><p>${esc(c.review.note)}</p></div>`:'<p class="source-caption">尚未填写看效果，当前不判断改善成效。</p>'}<button class="outline" data-review>记录检查经营效果</button></section>`}
function openPlan(id){const a=advisoryForSite(),p=a?.plans.find(p=>p.id===id);if(!p)return;const c=strategicChoices[state.site];$('#drawer-content').innerHTML=`<div class="drawer-head"><div class="dialog-top"><span class="tag blue">经营改善方案 · ${p.horizon}</span><button class="close" data-close aria-label="关闭经营方案">×</button></div><h2 id="drawer-title">${p.title}</h2></div><div class="drawer-body"><section class="detail-section"><h3>希望改善什么</h3><p>${a.target}，需根据接入数据校准。</p></section><section class="detail-section"><h3>落实为这些动作</h3><ol class="action-plan-list">${p.steps.map(([owner,title,result,due])=>`<li><strong>${title}</strong><span>${owner} · ${due.slice(5).replace('T',' ')}前</span><p>${result}</p></li>`).join('')}</ol></section><section class="detail-section"><h3>需要什么条件</h3><p>${p.resources}</p></section><section class="detail-section"><h3>何时看效果，何时调整</h3><p>${p.checkpoint}</p><p>${p.stop}</p></section><div class="drawer-actions"><button class="outline" data-close>再比较一下</button>${c?.planId===id?'<button class="primary" data-close data-nav="supervision">查看已生成任务</button>':`<button class="primary" data-adopt-plan="${id}">${c?'改选此方案并建立新任务':'采纳并建立执行计划'}</button>`}</div>${c&&c.planId!==id?'<p class="micro">原方案任务将保留，改选不会自动撤销已有执行安排。</p>':''}<p class="micro">仅创建本地演示记录，正式下达需接入企业组织与通知系统。</p></div>`;$('#detail').showModal()}
function adoptPlan(id){const a=advisoryForSite(),p=a?.plans.find(x=>x.id===id);if(!p)return;const prev=strategicChoices[state.site];if(prev?.planId===id){toast('该方案已经采纳');return}const ids=p.steps.map(([owner,title,acceptance,due],i)=>{const old=tasks.find(t=>t.site===state.site&&t.strategyId===id&&t.strategyStep===i);if(old)return old.id;const idTask='JY-'+state.site+'-'+Date.now()+'-'+i;tasks.push({id:idTask,site:state.site,strategyId:id,strategyStep:i,issueId:null,title,owner,acceptance,due,status:'待接单',progress:0,note:p.why+' '+p.resources,logs:[['16:30','由经营者采纳经营改善方案形成任务']]});return idTask});strategicChoices[state.site]={planId:id,planTitle:p.title,taskIds:ids,review:null};$('#detail').close();render();toast('经营改善方案已形成'+ids.length+'项演示任务')}
function openReview(){const c=strategicChoices[state.site];if(!c)return;$('#drawer-content').innerHTML=`<div class="drawer-head"><div class="dialog-top"><span class="tag blue">经营效果看效果</span><button class="close" data-close aria-label="关闭看效果">×</button></div><h2 id="drawer-title">${esc(c.planTitle)}</h2></div><div class="drawer-body"><p class="intro-note">由经营者填写效果判断，系统不会将“任务完成”等同于“经营改善”。本版未接入后续实际数据。</p><form id="strategy-review"><label class="field">目前结果<select name="result"><option>数据不足，暂不能判断</option><option>有改善，继续观察</option><option>未改善，调整方案</option></select></label><label class="field" style="margin-top:20px">依据与下一步<textarea name="note" required maxlength="600" rows="4" placeholder="填写比较周期、实际变化和接下来要调整的动作"></textarea></label><div class="drawer-actions"><button class="primary">保存看效果</button></div></form></div>`;$('#detail').showModal()}

function buildDirective(text){const inspection=/视察|调研|接待|检查|参观/.test(text),business=/下滑|经营|客流|收入|营销/.test(text);const groups=inspection?[
 ['现场运营负责人','现场运行准备',[['安保班长','岗位员工E01','复核游览通行与应急通道','巡查记录、发现问题及处置情况'],['设施班长','岗位员工E02','检查沿线设施与备用安排','设备检查结果及未恢复项目清单']]],
 ['综合负责人','综合协调准备',[['保洁班长','岗位员工E03','完成公共区域清洁复查','复查范围、发现问题与处理记录'],['行政组长','岗位员工E04','整理真实经营资料和待解决问题','资料目录、数据来源与未结问题清单']]],
 ['游客服务负责人','游客服务准备',[['客服班长','岗位员工E05','确认正常游客引导和服务安排','服务点位、班次与游客反馈路径'],['接待组长','岗位员工E06','落实接待人员分工和联络安排','岗位分工及内部联络表']]]
 ]:business?[
 ['营销负责人','经营分析与行动',[['渠道组长','岗位员工E01','整理重点渠道近期表现','可比周期数据、主要差额与候选原因'],['营销组长','岗位员工E02','提出一周经营动作顺序','每项动作的资源、目标和看效果节点']]],
 ['现场运营负责人','现场与产品核查',[['票务班长','岗位员工E03','走查主力产品购买与使用链路','阻点清单及修复安排'],['客服班长','岗位员工E04','整理游客需求与服务反馈','真实样本、共性问题和待验证判断']]]
 ]:[['综合负责人','任务澄清与执行',[['执行组长','岗位员工E01','澄清指令目标、范围与完成标准','保留确认结果和责任分工'],['执行组长','岗位员工E02','按确认后的任务范围执行并反馈','执行结果、证据与未完成项']]]];return {id:'L-'+state.site+'-'+(directives.length+1),site:state.site,text,type:inspection?'视察准备':business?'经营改善':'通用指令',template:inspection||business,title:inspection?'视察准备与逐层执行':business?'经营改善专项执行':'指令分解与执行',date:'2026-08-31',time:'待确认',coordinator:'综合负责人',scope:inspection?'到访人数、时间与路线由总负责人确认':business?'比较周期、改善目标与资源由总负责人确认':'目标、范围、截止时间和责任组织待确认',departments:groups.map(([manager,title,leaves],g)=>({id:'D'+g,manager,title,accepted:false,tasks:leaves.map(([team,owner,title,evidence],i)=>({key:'D'+g+'T'+i,team,owner,title,evidence,due:'2026-08-30T19:00',delegated:false}))})),logs:[],closed:false}}
function chosenDirective(){return directives.find(c=>c.id===selectedCommands[state.site]&&c.site===state.site)}
function commandPage(){const c=chosenDirective();if(c)return directiveTracker(c);const d=commandDrafts[state.site];return title('经营者一句话','一句指令，明确责任链，执行反馈逐层回到经营者')+`<section class="command-composer"><div class="section-head"><h2>你想安排什么？</h2><span class="tag blue">AI拆解 · 演示模板</span></div><form id="command-input"><label class="sr-only" for="boss-instruction">经营指令</label><textarea id="boss-instruction" name="instruction" rows="3" maxlength="800" required placeholder="例如：明天市领导要来视察">${esc(commandInputs[state.site]||'')}</textarea><div class="compose-actions"><button type="button" class="sample-prompt" data-example="明天市领导要来视察">试试：明天市领导要来视察</button><button class="primary">帮我安排 →</button></div></form></section>${d?directiveDraft(d):`<div class="command-path"><span>经营者表达意图</span><b>→</b><span>管理层负责</span><b>→</b><span>班组分派</span><b>→</b><span>岗位执行</span><b>→</b><span>逐层反馈与验收</span></div><section class="content-panel"><h2>经营者最终收到什么</h2><p class="advisor-copy">哪些部门已接收、哪些员工已接单、哪些动作已完成、哪里遇到困难，以及哪些事情仍需要经营者拍板。未说明的信息会成为总负责人的确认任务。</p></section>`}${commandHistory()}<p class="source-caption">当前是文字输入与规则模板演示，并非通用自然语言模型。任务及通知均不离开本页面；刷新将恢复演示。</p>`}
function directiveDraft(d){return `<section class="content-panel directive-draft"><div class="section-head"><div><span class="tag amber">待确认草案</span><h2>${d.title}</h2></div><span class="muted">${d.departments.length}个管理分工 · ${d.departments.reduce((n,g)=>n+g.tasks.length,0)+1}项任务</span></div><p class="original-command">“${esc(d.text)}”</p><p class="intro-note">${d.template?'已按演示组织结构分解。时间、范围和责任人可修改；尚未说明的信息先交总负责人确认。':'该句使用通用执行模板，请先调整任务范围与责任分工；系统没有理解或补全未提供的具体业务细节。'}</p><form id="publish-directive"><div class="form-grid"><label class="field">事项日期<input name="date" type="date" value="${d.date}" required></label><label class="field">到访 / 开始时间<input name="time" maxlength="60" value="${esc(d.time)}" required></label><label class="field">总负责人<input name="coordinator" value="${esc(d.coordinator)}" maxlength="40" required></label><label class="field">范围与待确认信息<input name="scope" value="${esc(d.scope)}" maxlength="200" required></label></div><div class="coordination-task"><strong>先做这件事：总负责人确认关键安排</strong><p>今天18:00前确认时间、范围、组织分工及需经营者决策的事项。未知信息不自动当成已确认。</p></div>${d.departments.map(g=>`<fieldset class="draft-department"><legend>${g.title}</legend><div class="draft-summary"><strong>${esc(g.manager)} 负责</strong>${g.tasks.map(t=>`<p>${esc(t.title)}<small>${esc(t.team)} → ${esc(t.owner)}</small></p>`).join('')}</div><details class="draft-edit"><summary>修改责任分工、时限与验收依据</summary><label class="field">管理层负责人<input name="${g.id}-manager" value="${esc(g.manager)}" maxlength="40" required></label>${g.tasks.map(t=>`<div class="draft-task"><label class="field">执行动作<input name="${t.key}-title" value="${esc(t.title)}" maxlength="120" required></label><div class="form-grid"><label class="field">班组负责人<input name="${t.key}-team" value="${esc(t.team)}" maxlength="40" required></label><label class="field">岗位执行人<input name="${t.key}-owner" value="${esc(t.owner)}" maxlength="40" required></label></div><div class="form-grid"><label class="field">完成时限<input name="${t.key}-due" type="datetime-local" value="${t.due}" required></label><label class="field">反馈 / 验收依据<input name="${t.key}-evidence" value="${esc(t.evidence)}" maxlength="200" required></label></div></div>`).join('')}</details></fieldset>`).join('')}<div class="draft-publish"><div><strong>先下达准备动作，未知事项由总负责人补齐</strong><p>各部门接收后，班组再分派到岗位；反馈逐层复核。</p></div><button class="primary">确认并下达（演示）</button></div></form></section>`}
function commandHistory(){const list=directives.filter(c=>c.site===state.site);return list.length?`<section class="content-panel"><div class="section-head"><h2>已下达指令</h2><span class="tag">${list.length}条</span></div>${list.map(c=>{const tt=tasks.filter(t=>t.commandId===c.id);return `<button class="history-directive" data-directive="${c.id}"><strong>${esc(c.text)}</strong><span>${c.closed?'已确认整项完成':tt.filter(t=>t.status==='已完成').length+'/'+tt.length+'项验收完成'} →</span></button>`}).join('')}</section>`:''}
function publishDirective(fd){const draft=commandDrafts[state.site];if(!draft)return;const c=JSON.parse(JSON.stringify(draft));c.id='L-'+state.site+'-'+(directives.length+1);c.date=String(fd.get('date'));c.time=String(fd.get('time')).trim();c.scope=String(fd.get('scope')).trim();c.coordinator=String(fd.get('coordinator')).trim();if(!c.coordinator||!c.time||!c.scope){toast('请保留待确认说明或填写已知信息');return}for(const g of c.departments){g.manager=String(fd.get(g.id+'-manager')).trim();for(const t of g.tasks){for(const f of ['title','team','owner','due','evidence'])t[f]=String(fd.get(t.key+'-'+f)).trim();if(!g.manager||!t.title||!t.team||!t.owner||!t.evidence){toast('请补充任务和责任分工');return}}}c.logs.push(['16:30','经营者确认草案，已建立本地演示指令']);const coord={id:c.id+'-CO',site:c.site,commandId:c.id,commandRole:'coordinator',title:'确认事项时间、范围与关键安排',owner:c.coordinator,due:'2026-08-30T18:00',status:'待接单',progress:0,note:c.scope,acceptance:'明确已确认安排、仍待确认事项和下一步负责人。',logs:[['16:30','总负责人任务已建立']]};tasks.push(coord);c.coordinatorTaskId=coord.id;for(const g of c.departments)for(const l of g.tasks){l.taskId=c.id+'-'+l.key;tasks.push({id:l.taskId,site:c.site,commandId:c.id,commandDept:g.id,title:l.title,owner:l.owner,due:l.due,status:'待接单',progress:0,note:c.text,acceptance:l.evidence,logs:[['16:30','执行任务已建立，等待管理层接收及班组分派']]})}directives.push(c);selectedCommands[state.site]=c.id;delete commandDrafts[state.site];render();window.scrollTo({top:0});toast('演示指令已下达，等待各管理层接收')}
function directiveTracker(c){const tt=tasks.filter(t=>t.commandId===c.id),leaves=c.departments.flatMap(g=>g.tasks),complete=tt.filter(t=>t.status==='已完成').length,blocked=tt.filter(t=>t.status==='遇到困难'),accepted=c.departments.filter(g=>g.accepted).length,assigned=leaves.filter(l=>l.delegated).length,coord=tasks.find(t=>t.id===c.coordinatorTaskId);return title('指令执行与反馈','景区'+state.site+' · '+c.id)+`<div class="directive-title"><div><span class="tag ${c.closed?'teal':'blue'}">${c.closed?'整项已完成':'已下达 · 演示'}</span><h2>“${esc(c.text)}”</h2><p>${esc(c.date)} · ${esc(c.time)} · 总负责人：${esc(c.coordinator)}</p></div><button class="outline" data-new-directive>＋ 新指令</button></div><div class="directive-stats"><div><strong>${accepted}/${c.departments.length}</strong><span>管理层已接收</span></div><div><strong>${assigned}/${leaves.length}</strong><span>岗位任务已分派</span></div><div><strong>${complete}/${tt.length}</strong><span>任务验收完成</span></div><div><strong class="${blocked.length?'danger-text':''}">${blocked.length}</strong><span>遇到困难需协调</span></div></div><div class="directive-grid"><div><section class="content-panel"><div class="section-head"><h2>总负责人的先做这件事</h2><span class="tag">管理层</span></div>${taskRow(coord)}</section>${c.departments.map(g=>{const gt=tasks.filter(t=>t.commandId===c.id&&t.commandDept===g.id);return `<section class="department-tree"><div class="department-head"><span class="tree-level">管理层</span><div><h3>${esc(g.manager)} · ${g.title}</h3><p>${g.accepted?'已接收，负责协调资源与最终验收':'尚未接收，基层任务等待分派'}</p></div>${g.accepted?'<span class="tag teal">已接收</span>':`<button class="outline" data-dept-ack="${c.id}|${g.id}">模拟管理层接收</button>`}</div><div class="department-tasks">${g.tasks.map(l=>{const t=tasks.find(t=>t.id===l.taskId);return `<div class="chain-task"><div class="chain-owner"><span>班组：${esc(l.team)}</span><span>↓</span><span>岗位：${esc(l.owner)}</span>${l.delegated?'<span class="tag teal">已分派</span>':`<button class="text-link" data-delegate="${c.id}|${l.key}" ${g.accepted?'':'disabl function recordCommandFeedback(t,action,note,fd){const {c,g,l}=commandContext(t);if(!c||t.status==='已完成')return;if(t.commandRole!=='coordinator'&&(!g?.accepted||!l?.delegated))return;const actor=t.commandRole==='coordinator'?t.owner:t.status==='待班组复核'?l.team:t.status==='待管理层验收'?g.manager:t.owner;if(t.status!=='待接单'&&!note){toast('请填写执行结果、复核意见或卡住的问题原因');return}let msg;if(action==='blocked'){t.status='遇到困难';msg=actor+'上报遇到困难：'+note}else if(action==='return'){t.status='进行中';t.progress=60;msg=actor+'退回补充：'+note}else if(t.status==='待接单'){t.status='进行中';t.progress=10;msg=actor+'已接单'+(note?'：'+note:'')}else if(t.commandRole==='coordinator'){if(fd?.get('confirmed')==='yes'){const tm=String(fd.get('confirmedTime')||'').trim(),sc=String(fd.get('confirmedScope')||'').trim();if(!tm||!sc||/待确认/.test(tm+sc)){toast('请填写已确认的时间和范围，或保留待确认状态');return}c.time=tm;c.scope=sc;t.status='已完成';t.progress=100;msg=actor+'已确认安排：'+tm+'；'+sc+'；'+note}else{t.status='遇到困难';msg=actor+'仍待协调确认：'+note}}else if(t.status==='进行中'||t.status==='遇到困难'){t.status='待班组复核';t.progress=80;msg=actor+'提交执行结果：'+note}else if(t.status==='待班组复核'){t.status='待管理层验收';t.progress=90;msg=actor+'复核通过：'+note}else{t.status='已完成';t.progress=100;msg=actor+'验收通过：'+note}t.logs.push(['16:30',msg]);c.logs.push(['16:30',t.title+' · '+msg]);render();openCommandTask(t);toast('反馈已逐层汇总到指令进度')}

function goalBlock(){const a=advisoryForSite(),g=op.goals[state.site];return `<section class="content-panel goal-panel"><div class="section-head"><h2>经营目标</h2><button class="text-link" data-goal>设置目标 →</button></div>${a?`<span class="muted">08/24—08/30 · ${a.metric}</span><div class="goal-value">${sevenDayStats(a).sum.toFixed(2)}<small>万元</small></div>${g?`<div class="thin-track"><span style="width:${Math.min(100,sevenDayStats(a).sum/g*100)}%"></span></div><p>目标 ${fmt(g)}万元 · 完成 ${(sevenDayStats(a).sum/g*100).toFixed(1)}%</p><p>${sevenDayStats(a).sum<g?'距目标还差 '+(g-sevenDayStats(a).sum).toFixed(2)+'万元':'已达到本期目标'}</p>`:'<p>尚未设置本期目标</p><small>参考值用于判断变化，不代替你的经营目标。</small>'}`:'<p>本期目标与连续历史待补齐</p>'}<div class="v5-divider"></div><div class="tiny-pairs"><span>未来7天预订</span><b>待接入</b><span>利润与现金</span><b>待接入</b></div></section>`}
function entryDecision(){const e=op.entrance[state.site];if(state.site!=='A')return '';return `<article class="op-card danger-card"><div class="section-head"><span class="tag red">现在协调 · 入口服务</span><span class="muted">现场运营负责人</span></div><h2>${e?'补位已安排，等待现场结果':'入口排队18分钟，补位已逾期'}</h2><p>入口缺2岗、设备G03离线，合并跟进通行问题。岗位与设备变化尚不能单独解释排队原因。</p><div class="decision-request"><b>${e?'已选安排':'需要你决定'}</b><span>${e?esc(e.label):'是否先调2名机动人员补位，并并行检查设备？'}</span></div><div class="op-card-footer"><span>${e?'到岗和排队改善仍需现场确认':'原岗位有人值守需先确认 · 不新增费用'}</span><button class="${e?'outline':'primary'}" data-entry>${e?'跟进现场结果':'就这样安排'} →</button></div></article>`}
function strategyDecision(){const a=advisoryForSite(),c=strategicChoices[state.site];return `<article class="op-card"><div class="section-head"><span class="tag blue">${a?'本周经营 · '+(c?'执行中':'待选择'):'经营机会 · 待验证'}</span><span class="muted">${a?'最近7天的经营变化':'景区B'}</span></div><h2>${a?a.title:'经营平稳，提前核对下周预订与服务准备'}</h2><p>${a?a.finding:'当前数据未触发持续下滑。先取得未来预订和排班，再判断是否需要吸引游客或服务调整。'}</p><div class="decision-request"><b>${c?'已选方案':'需要你决定'}</b><span>${c?esc(c.planTitle):a?'先核查原因，还是开展小范围验证？':'是否安排一次下周经营准备检查？'}</span></div><div class="op-card-footer"><span>${c?'执行与效果分别跟踪':a?'先看原因、费用和人手，再安排下去':'不预设必须增加投放'}</span><button class="primary" data-nav="strategy">${c?'查看执行与效果':'比较经营方案'} →</button></div></article>`}
function directiveDigest(){const cs=directives.filter(c=>c.site===state.site);return `<section class="content-panel"><div class="section-head"><h2>我交代的事</h2><button class="text-link" data-nav="command">所有交办的事 →</button></div>${cs.length?cs.slice(-2).reverse().map(c=>{const s=commandReadiness(c);return `<button class="command-digest" data-directive="${c.id}"><strong>${esc(c.text)}</strong><span class="tag ${s.ready?'teal':'amber'}">${s.ready?'已具备完成条件':s.blockers.length+'项关键安排待落实'}</span><small>${esc(c.coordinator)} · ${s.done}/${s.total}项验收 · ${s.ready?'可汇总结果':esc(s.blockers[0])}</small></button>`}).join(''):'<p class="muted">在上方说一句话，安排工作并持续收取反馈。</p>'}</section>`}
function handlingList(){const list=issues().filter(a=>!['frontline','device','paid','pos'].includes(a.id));return `<section class="content-panel"><div class="section-head"><h2>其他需要留意的事</h2><button class="text-link" data-nav="analysis">所有提醒 →</button></div><p class="panel-desc">已归并入口与经营趋势；这里保留独立事项。</p>${list.map(a=>{const t=linkedIssue(a.id),s=selections[key(a.id)];return `<div class="handling-row"><div><b>${a.title}</b><p>${t?t.owner+' · '+t.status:s?'已记录：'+s.choiceTitle:a.owner+' · 待安排核查'}</p></div><button class="text-link" data-anomaly="${a.id}">${t?'查看进展':s?'查看选择':'安排处理'} →</button></div>`}).join('')||'<p class="muted">这次没有新增独立预警。</p>'}</section>`}
function homeDataBoard(){const d=current();return `<section class="home-data-board" aria-label="经营数据看板"><div class="section-head"><div><h2>经营数据看板</h2><p>景区${state.site} · 08/30 截至16:30 · 模拟数据</p></div><button class="primary" data-nav="overview">查看完整数据看板 →</button></div><div class="home-data-grid">${['paid','entry','orders','refund','pos','parking'].map(k=>`<button class="home-data-metric" data-home-metric="${k}" aria-label="${metrics[k].name}，查看趋势"><span>${metrics[k].name}</span><strong>${fmt(d[k])}<small>${metrics[k].unit}</small></strong><p>${delta(k)}</p><em>查看趋势 →</em></button>`).join('')}</div><p class="home-data-note">各项金额按各自口径展示，不直接相加。点击指标查看趋势与明细。</p></section>`}
homePage=function(){const ts=teamStats(),d=current(),active=myTasks().filter(t=>t.status!=='已完成'),pending=(state.site==='A'&&!op.entrance.A?1:0)+(typeof gruns==='function'?(gruns().some(r=>r.status==='进行中')?0:1):(advisoryForSite()&&!strategicChoices[state.site]?1:state.site==='B'&&!op.opportunity.B?1:0)),cs=directives.filter(c=>c.site===state.site&&!commandReadiness(c).ready);return title('景区经营一览','先看经营数据，再看异常、建议和执行进展')+homeDataBoard()+homeCommandBar()+`<div class="v5-summary"><span><i class="live-dot"></i> 截至16:30 · 模拟经营现场</span><b>${pending}项等你决定</b><button data-task-filter="overdue">${active.filter(overdue).length}项超时待处理 →</button><button data-nav="command">${cs.length}件交办的事待完成 →</button></div><div class="operator-grid"><div class="operator-main"><div class="section-head"><h2>需要你关注</h2><span class="muted">紧急处置在前，经营改善随后</span></div>${entryDecision()}${strategyDecision()}${directiveDigest()}${handlingList()}</div><aside class="operator-aside">${goalBlock()}<section class="content-panel"><div class="section-head"><h2>现场保障</h2><button class="text-link" data-nav="staff">查看 →</button></div><div class="tiny-pairs"><span>当前在岗 / 排班</span><b>${ts.present} / ${ts.planned}人</b><span>关键岗位待补</span><b>${ts.missing}人</b><span>机动人员</span><b>2人 · 调配需确认</b></div><p class="source-caption">${state.site==='A'?'入口支援安排见左侧统一事项。':'暂离不等于失去服务保障，先确认替岗与返回时间。'}</p></section>${d.perf?`<section class="content-panel"><div class="section-head"><h2>演出情况</h2><span class="tag">有演出的景区显示</span></div><p>${d.perfData?'演出票使用率'+(d.perfData.checked/d.perfData.eligible*100).toFixed(0)+'% · 比参考日期'+(d.perfData.checked/d.perfData.eligible*100<d.perfData.prevRate?'下降':'上升')+Math.abs((d.perfData.checked/d.perfData.eligible*100)-d.perfData.prevRate).toFixed(0)+'个百分点':'已配置，场次与使用资料待补齐'}</p><button class="text-link" data-nav="overview">查看详情 →</button></section>`:''}<div class="utility-links"><button data-nav="decisions">我选过的建议</button><button data-nav="data">数据说明</button></div></aside></div>`};
homeCommandBar=function(){return `<section class="boss-bar"><span class="boss-symbol">令</span><form id="home-command"><label class="sr-only" for="quick-order">一句话安排工作</label><input id="quick-order" name="instruction" maxlength="800" placeholder="说一句话：明天市领导要来视察" required><button class="primary">帮我安排 →</button></form></section>`};
function openEntry(){const e=op.entrance.A;v5Dialog('入口通行：协调安排与现场结果',`<div class="fact-grid"><div><label>排队反馈</label><strong>约18分钟</strong></div><div><label>岗位 / 设备可用</label><strong>10/12人 · 3/4台</strong></div></div><p class="intro-note">补位和设备排查并行推进。完成任务后，仍需新的现场反馈确认是否恢复。</p><form id="v5-entry"><label class="field">协调方案<select name="choice"><option value="support">调2名机动人员补位，先确认原岗位有人值守</option><option value="verify">先由带班人核实现场，15分钟内回报</option></select></label><label class="field">协调要求<textarea name="note" required rows="3" placeholder="例如：17:00前反馈到岗及排队变化，保留原服务岗位">${esc(e?.note||'17:00前反馈到岗与排队变化；设备排查同步进行，保障原岗位有人值守。')}</textarea></label><div class="drawer-actions"><button class="primary">${e?'更新协调要求':'确认并关联任务'}</button></div></form>${e?'<div class="quality-note"><strong>效果仍待确认</strong><p>模拟来源仍为16:30数据；安排补位不代表人员已到岗或排队已缓解。</p><button class="text-link" data-task="DB-A01">查看人员任务 →</button></div>':''}`)}
function openGoal(){const a=advisoryForSite();v5Dialog('设置本期经营目标',a?`<p class="intro-note">08/24—08/30 · ${a.metric}。这里设置你认可的目标；未提供月度历史，因此不推算月度达成和利润。</p><form id="v5-goal"><label class="field">本期目标（万元）<input name="goal" type="number" min="0.01" step="0.01" required value="${op.goals[state.site]||''}" placeholder="输入经营目标"></label><div class="drawer-actions"><button class="primary">保存目标</button></div></form>`:'<p>景区B连续历史待补齐，暂不计算本期目标达成。</p>')}
function outcomePanel(c){const r=op.outcomes[state.site];return `<section class="content-panel round-outcome"><div class="section-head"><h2>执行之后，有没有改善？</h2><span class="tag ${r?'blue':'amber'}">${r?'后续模拟看效果':'等待后续数据'}</span></div>${r?outcomeText(r,c):'<p>当前是8月30日数据。执行进度不能代替经营结果，需要补充后续按相同规则统计观察数据。</p>'}<div class="drawer-actions"><button class="outline" data-outcome>录入 / 演示后续结果</button><button class="text-link" data-nav="supervision">查看执行任务 →</button>${r?'<button class="text-link" data-end-round>结束这次，调整下一步 →</button>':''}</div></section>`}
function outcomeText(r,c){if(!r.complete)return '<div class="quality-note"><b>数据不足，暂不判断改善</b><p>先补齐按相同规则统计实际、参考值与费用信息；已有任务不因缺数被判定失败。</p></div>';const before=sevenDayStats(advisoryForSite()).change,after=(r.actual/r.baseline-1)*100,improved=after>before,met=c.gap!==null?after>=-c.gap:improved;const guard=r.adverse||r.cost>c.budget;return `<p class="source-caption">${esc(r.period)} · 手工录入的模拟看效果；不覆盖首页8月30日数据</p><div class="result-metrics"><div><small>本次结果 / 参考值</small><strong>${r.actual.toFixed(2)} / ${r.baseline.toFixed(2)}<small>万元</small></strong></div><div><small>较参考值变化</small><strong>${after.toFixed(1)}%<small>此前 ${before.toFixed(1)}%</small></strong></div></div><p>新增费用 ${fmt(r.cost)}元 / 费用上限 ${fmt(c.budget)}元 · ${r.adverse?'退款或投诉恶化':'未报告退款或投诉恶化'}</p><div class="decision-request"><b>AI建议下一步</b><span>${guard?'暂停扩大行动，先核实费用超限或服务副作用。':!improved?'暂不扩大投入。复查执行是否到位，再重新判断原因与方案。':!met?'已有改善，但尚未达到你设定的希望达到的水平；保持小范围验证，继续收集数据。':'经营表现有改善，先维持当前规模再观察一个周期，不直接认定为方案带来的收益。'}</span></div><p class="source-caption">${esc(r.note)} · 天气、节假日与客流结构仍需核对，变化不等于因果。</p>`}
strategyPage=function(){const a=advisoryForSite(),c=strategicChoices[state.site];if(!a)return title('AI出主意','经营平稳时，也提前准备下一步')+`<section class="op-card"><span class="tag teal">机会检查 · 证据待补</span><h2>提前检查下周预订与服务准备</h2><p>景区B当前未触发持续下滑。建议先补未来7天预订、已确定团队和重点岗位排班，再决定是否安排吸引游客或增配服务。</p><div class="decision-request"><b>本次授权范围</b><span>综合负责人明日18:00前整理资料；不新增投放费用，不预设增长目标。</span></div><button class="primary" data-opportunity>${op.opportunity[state.site]?'查看已安排的检查':'安排经营准备检查'}</button></section>`;const st=sevenDayStats(a);return title('AI出主意','看清依据和取舍，再决定投入；执行后继续看结果')+`<div class="operator-grid"><div class="operator-main"><section class="advisor-verdict"><span class="tag blue">${c?'方案推进中':'建议先验证原因'}</span><h2>${a.title}</h2><p>${a.finding}</p><div class="decision-request"><b>目前可以判断</b><span>已经知道主要少在哪一块；具体原因还要核实。</span></div></section><section class="content-panel"><h2>方案怎么选</h2><p class="panel-desc">投入是拟定安排；选择时确认费用上限和人手。没有把握时先做核查。</p><div class="plan-compare">${a.plans.map((p,i)=>{const m=planDetails[p.id];return `<article><div class="section-head"><span class="tag ${i===0?'teal':''}">${i===0?'优先建议':'备选'}</span><small>${p.horizon}</small></div><h3>${p.title}</h3><dl><dt>适用条件</dt><dd>${m.condition}</dd><dt>要花钱、用人吗</dt><dd>${m.cost}</dd><dt>看什么结果</dt><dd>${m.signal}</dd><dt>主要风险</dt><dd>${m.risk}</dd></dl><button class="${i===0?'primary':'outline'}" data-plan="${p.id}">${c?.planId===p.id?'查看已确认安排':c?'比较方案':'选这个，确认怎么做'} →</button></article>`}).join('')}</div></section>${c?`<section class="content-panel round-execution"><h2>这次执行安排</h2><p>${esc(c.planTitle)} · ${esc(c.owner)}负责</p><p>新增费用上限 ${fmt(c.budget)}元 · ${c.gap===null?'先观察较参考值变化是否改善':'希望达到的水平：较参考值下降不超过'+c.gap+'%'} </p><p>完成 ${tasks.filter(t=>c.taskIds.includes(t.id)&&t.status==='已完成').length}/${c.taskIds.length}项 · ${esc(c.constraint)}</p><button class="text-link" data-nav="supervision">跟进任务与卡住的事 →</button></section>${outcomePanel(c)}`:''}</div><aside class="operator-aside"><section class="content-panel"><h2>判断依据</h2><div class="goal-value">${st.change.toFixed(1)}%<small>最近7天比参考值</small></div>${sevenDayChart(a)}<div class="table-wrap"><table class="source-table"><thead><tr><th>分项</th><th>实际</th><th>参考值</th><th>差额</th></tr></thead><tbody>${a.evidence.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="source-caption">08/24—08/30 · 万元 · 同时段模拟样本。正式参考值需对齐星期、节假日与营业条件。</p></section><section class="content-panel"><h2>仍需核实</h2><p>${a.hypothesis}</p><p class="source-caption">AI当前按演示规则生成建议；这里不预估未经验证的新增收益。</p></section></aside></div>`};
openPlan=function(id){const a=advisoryForSite(),p=a?.plans.find(p=>p.id===id),c=strategicChoices[state.site];if(!p)return;const m=planDetails[id];v5Dialog(p.title,`<p class="intro-note">${m.condition}</p><ol class="action-plan-list">${p.steps.map(([owner,t,result,due])=>`<li><strong>${t}</strong><span>${owner} · ${due.replace('T',' ')}</span><p>${result}</p></li>`).join('')}</ol><div class="quality-note"><b>先约定投入与停止条件</b><p>${m.cost}</p><p>${p.stop}</p></div>${c?`<p class="intro-note">已有执行方案：${esc(c.planTitle)}。这次先完成验证与看效果，避免重复下达相互冲突的任务。</p><button class="primary" data-close data-nav="supervision">查看这次任务</button>`:`<form id="v5-adopt" data-id="${id}"><div class="form-grid"><label class="field">总负责人<select name="owner">${owners.map(o=>`<option ${o===p.steps[0][0]?'selected':''}>${o}</option>`).join('')}</select></label><label class="field">新增费用上限（元）<input name="budget" type="number" min="0" max="10000000" step="1" value="0" required></label></div><label class="field">可接受的较参考值降幅（%，可留空）<input name="gap" type="number" min="0" max="100" step="0.1" placeholder="由你设定；留空先观察是否改善"></label><label class="field">人手和费用安排与执行要求<textarea name="constraint" required rows="3">使用现有人员，负责人确认时间安排；新增支出不得超过上限，超限重新提请决策。</textarea></label><label class="v5-check"><input name="confirmed" type="checkbox" required>已确认适用条件和人手安排，可下达这次验证任务</label><div class="drawer-actions"><button class="primary">确定方案，安排下去</button></div></form>`}`)};
function openOutcome(){const c=strategicChoices[state.site];if(!c)return;v5Dialog('用后续数据看效果经营效果',`<p class="intro-note">这是单独的后续观察窗口，当前页面不连接业务系统。可录入模拟数据，也可载入样例体验建议变化。</p><div class="sample-row"><button class="outline" data-result-sample="good">载入改善样例</button><button class="outline" data-result-sample="bad">载入未改善样例</button><button class="outline" data-result-sample="missing">体验数据不足</button></div><form id="v5-outcome"><label class="field">观察周期<input name="period" value="09/01—09/07（后续模拟）" required maxlength="80"></label><div class="form-grid"><label class="field">按相同规则统计实际（万元）<input name="actual" type="number" step="0.01" min="0" required></label><label class="field">参考值（万元）<input name="baseline" type="number" step="0.01" min="0.01" required></label><label class="field">新增费用（元）<input name="cost" type="number" min="0" step="1" required value="0"></label><label class="field">服务与退款<select name="adverse"><option value="no">未报告恶化</option><option value="yes">退款或投诉恶化</option></select></label></div><label class="field">比较依据与需要核实的变化<textarea name="note" required rows="3" placeholder="说明来源、可比条件和其他影响因素"></textarea></label><div class="drawer-actions"><button class="primary">记录并生成看效果建议</button></div></form>`)}
// Directive preparation, resource checks, changed arrangements and evidence remain linked.
buildDirective=function(text){const c=legacy.buildDirective(text);c.revision=1;c.resourceChoice='pending';c.resourceConfirmed=false;c.changePending=false;c.budget=0;c.boundary='不影响正常游客服务；新增费用另行确认';c.departments.forEach(g=>g.tasks.forEach(t=>t.critical=/通行|设施/.test(t.title)));return c};
function resourceSection(c){const inspection=c.type==='视察准备';return `<section class="resource-box"><div class="section-head"><h3>先确认人手和正常游客服务</h3><span class="tag amber">${inspection?'模拟排班冲突':'可用资源待确认'}</span></div><p>${inspection?'拟定接待时段09:00—10:00：机动组2人，其中1人已有正常服务安排；草案拟用2人，存在1人冲突。时间确认后需重新校核。':'先由总负责人核对人手、时间与既有任务，不能根据任务数量直接认定资源足够。'}</p><label class="field">人手怎么安排<select name="resourceChoice"><option value="pending">先下达核查准备，由总负责人解决冲突</option><option value="protect">${inspection?"保留正常服务，接待改为1人，负责人确认可行性":"保留正常服务，由负责人核定执行人手"}</option><option value="external">申请额外支援，确认来源与费用后再执行</option></select></label><div class="form-grid"><label class="field">新增费用上限（元）<input name="commandBudget" type="number" min="0" max="10000000" value="0" required></label><label class="field">人手和费用何时定下来<input name="resourceDue" type="datetime-local" required value="2026-08-30T18:00"></label></div><label class="field">哪些事不能影响<textarea name="boundary" rows="2" required>不影响正常游客服务；未确认路线前不实施沿线调整，新增费用不得超限。</textarea></label></section>`}
directiveDraft=function(c){let html=legacy.directiveDraft(c);html=html.replace('<div class="draft-publish">',resourceSection(c)+'<div class="draft-publish">');html=html.replace('确认并下达（演示）','确认安排并下达（演示）');return html};
publishDirective=function(fd){const draft=commandDrafts[state.site];if(!draft)return;draft.resourceChoice=String(fd.get('resourceChoice')||'pending');draft.resourceConfirmed=false;draft.resourceDue=String(fd.get('resourceDue')||'2026-08-30T18:00');draft.budget=Number(fd.get('commandBudget')||0);draft.boundary=String(fd.get('boundary')||'').trim();legacy.publishDirective(fd);const c=chosenDirective();if(c){const t=tasks.find(t=>t.id===c.coordinatorTaskId);t.due=c.resourceDue;t.acceptance+=' 核实可用人员、正常服务保障和新增费用。';render()}};
function commandReadiness(c){const tt=tasks.filter(t=>t.commandId===c.id),coord=tt.find(t=>t.commandRole==='coordinator'),blockers=[];if(coord?.status!=='已完成')blockers.push('时间、范围及关键安排待确认');if(!c.resourceConfirmed)blockers.push('人手与正常游客服务待确认');if(c.departments.some(g=>!g.accepted))blockers.push(c.changePending?'变更后的安排尚未全部重确认':'部门尚未全部接收');if(tt.some(t=>t.status==='遇到困难'))blockers.push('执行遇到卡住的事，需协调');if(tt.some(t=>t.status!=='已完成'&&t.commandRole!=='coordinator'))blockers.push('岗位执行或验收尚未完成');return {ready:blockers.length===0,blockers,done:tt.filter(t=>t.status==='已完成').length,total:tt.length}}
function resourceLabel(c){return c.resourceChoice==='protect'?(c.type==='视察准备'?'保留正常服务，接待按1人安排':'正常服务保持覆盖，按已确认人手执行'):c.resourceChoice==='external'?'申请额外支援，待落实来源':'由总负责人核查人员与任务冲突'}
directiveTracker=function(c){const s=commandReadiness(c),tt=tasks.filter(t=>t.commandId===c.id);return title('一句话交办','一条指令贯穿安排、执行、变更与结果')+`<section class="directive-title"><div><span class="tag ${s.ready?'teal':'amber'}">${s.ready?'已具备完成条件':'尚未准备就绪'} · 第${c.revision||1}版安排</span><h2>“${esc(c.text)}”</h2><p>${esc(c.date)} · ${esc(c.time)} · ${esc(c.coordinator)}负责</p></div><button class="outline" data-change="${c.id}">调整时间 / 范围</button></section><div class="operator-grid"><div class="operator-main"><section class="readiness-panel"><div class="section-head"><h2>${s.ready?'关键安排与执行已完成':'先解决这些关键问题'}</h2><b>${s.done}/${s.total}项验收</b></div>${s.blockers.map((b,i)=>`<div class="readiness-row"><span>${i+1}</span><p>${b}</p></div>`).join('')||'<p>总负责人已确认安排与资源，各项执行均有验收记录。可展开查看依据。</p>'}<p class="source-caption">任务数量不代表准备程度；关键安排未确认时，即使其他任务完成也不会显示就绪。</p></section><section class="content-panel"><h2>总负责人与人手和费用安排</h2><p>${esc(resourceLabel(c))}</p><p>费用上限 ${fmt(c.budget||0)}元 · ${esc(c.boundary||'不影响正常经营')}</p>${taskRow(tt.find(t=>t.commandRole==='coordinator'))}<div class="resource-status"><span class="tag ${c.resourceConfirmed?'teal':'amber'}">${c.resourceConfirmed?'人手和费用安排已确认':'人手和费用安排待确认'}</span>${c.resourceConfirmed?`<p>${esc(c.resourceEvidence)}</p>`:`<p>负责人须说明可用人手、正常服务覆盖与费用；选择方案本身不代表支援已落实。</p><button class="outline" data-resource="${c.id}">记录负责人人手和费用确认</button>`}</div></section><section class="content-panel"><div class="section-head"><h2>各部门执行</h2><small>按责任组织，按重要程度验收</small></div>${c.departments.map(g=>{const gt=tt.filter(t=>t.commandDept===g.id),done=gt.filter(t=>t.status==='已完成').length;return `<details class="department-fold" data-detail-key="${c.id}-${g.id}"><summary><span><b>${esc(g.manager)}</b><small>${esc(g.title)} · ${done}/${gt.length}项完成</small></span><span class="tag ${g.accepted?'teal':'amber'}">${g.accepted?'已接收':'待确认安排'}</span></summary><p class="source-caption">${g.accepted?'该部门已确认当前版本安排。':'先接收当前版本安排，再由班组分派；变更后需要重新确认。'}</p>${g.accepted?'':`<button class="outline" data-dept-ack="${c.id}|${g.id}">模拟部门确认安排</button>`}${g.tasks.map(l=>{const t=tt.find(t=>t.id===l.taskId);return `<div class="chain-task"><div class="chain-owner"><span>${esc(l.team)} → ${esc(l.owner)}</span><span class="tag">${l.critical?'关键项 · 两级验收':'常规项 · 班组验收'}</span></div>${taskRow(t)}${!l.delegated?`<button class="text-link" data-delegate="${c.id}|${l.key}" ${g.accepted?'':'disabled'}>模拟班组分派 →</button>`:''}</div>`}).join('')}</details>`}).join('')}</section></div><aside class="operator-aside"><section class="content-panel"><h2>执行顺序与依赖</h2><ol class="dependency-list"><li><b>先确认</b><p>总负责人确认时间、范围、人员与费用。</p></li><li><b>并行准备</b><p>资料整理和常规巡查可先做；不依赖未知路线。</p></li><li><b>再落实</b><p>沿线安排、联络分工在关键安排确认后提交验收。</p></li><li><b>收取结果</b><p>关键项两级验收，常规项班组验收，遇到困难即时上报。</p></li></ol></section><section class="content-panel"><h2>安排与反馈记录</h2><ol class="task-timeline">${c.logs.slice().reverse().slice(0,8).map(([time,msg])=>`<li><time>${time}</time><p>${esc(msg)}</p></li>`).join('')}</ol></section><button class="outline" data-new-directive>＋ 安排另一件事</button><button class="text-link" data-nav="supervision">查看全部任务 →</button></aside></div>`};
commandPage=function(){return legacy.commandPage().replaceAll('刷新将恢复演示','操作保存在本浏览器，可用重置演示清除').replaceAll('经营者一句话','一句话交办').replaceAll('经营者最终收到什么','你将收到的结果').replaceAll('老板表达意图','经营者表达意图').replaceAll('哪些员工已接单、','').replaceAll('老板拍板','你决策')};
const originalOpenCommandTask=openCommandTask;
openCommandTask=function(t){originalOpenCommandTask(t);const {c,l}=commandContext(t);if(t.commandRole!=='coordinator'&&c){const coord=tasks.find(x=>x.id===c.coordinatorTaskId);const gated=(/沿线|联络|分工|通行/.test(t.title)||(c.type==='通用指令'&&/执行并反馈/.test(t.title)))&&(!c.resourceConfirmed||coord?.status!=='已完成');if(gated&&['进行中','遇到困难'].includes(t.status)){const submit=$('#command-feedback button[value="advance"]');if(submit){submit.disabled=true;submit.insertAdjacentHTML('beforebegin','<p class="quality-note">依赖未满足：总负责人须先确认时间、范围和资源。可先记录卡住的事，暂不能提交完成反馈。</p>')}}if(l&&!l.critical){const p=$('#drawer-content .micro');if(p)p.textContent='常规项由班组验收；关键项另需管理层复核。所有反馈为本地模拟。'}}};
recordCommandFeedback=function(t,action,note,fd){const {c,g,l}=commandContext(t);if(!c)return;if(t.commandRole!=='coordinator'&&action==='advance'&&['进行中','遇到困难'].includes(t.status)&&(/沿线|联络|分工|通行/.test(t.title)||(c.type==='通用指令'&&/执行并反馈/.test(t.title)))&&(!c.resourceConfirmed||tasks.find(x=>x.id===c.coordinatorTaskId)?.status!=='已完成')){toast('关键安排与资源尚未确认，先协调依赖事项');return}if(t.status==='待班组复核'&&action==='advance'&&l&&!l.critical){if(!note){toast('请填写班组验收依据');return}t.status='已完成';t.progress=100;const msg=l.team+'验收通过：'+note;t.logs.push(['16:30',msg]);c.logs.push(['16:30',t.title+' · '+msg]);render();openCommandTask(t);return}if(t.commandRole==='coordinator'&&action==='advance'&&fd?.get('confirmed')==='yes'&&t.status!=='待接单'&&c.resourceConfirmed&&(String(fd.get('confirmedTime')).trim()!==c.time||String(fd.get('confirmedScope')).trim()!==c.scope)){c.resourceConfirmed=false;c.logs.push(['16:30','关键时间或范围更新，人手和费用安排需按最新信息重新确认'])}legacy.recordCommandFeedback(t,action,note,fd)};
function openResource(id){const c=directives.find(c=>c.id===id&&c.site===state.site);if(!c)return;v5Dialog('负责人确认资源与服务保障',`<p class="intro-note">${esc(resourceLabel(c))}。请由${esc(c.coordinator)}核实，不把拟定方案当成已经落实。</p><form id="v5-resource" data-id="${id}"><label class="field">落实后的安排<select name="choice"><option value="protect">${c.type==='视察准备'?'正常服务1人、接待1人，已确认可行':'执行人手与原岗位有人值守均已核实'}</option><option value="external" ${c.resourceChoice==='external'?'selected':''}>额外支援已落实，正常服务保持覆盖</option></select></label><label class="field">确认依据<textarea name="evidence" required rows="4" placeholder="记录人员或班组、时段、原岗位替代安排和费用核对结果"></textarea></label><label class="v5-check"><input type="checkbox" required>已核实正常服务覆盖，费用不超过费用上限</label><div class="drawer-actions"><button class="primary">保存模拟确认记录</button></div></form>`)}
function openChange(id){const c=directives.find(c=>c.id===id&&c.site===state.site);if(!c)return;v5Dialog('调整安排并重新确认',`<p class="intro-note">保留原始指令与历史记录。变更后，部门重新接收，资源重新校核；已完成的执行项需要复核新安排。</p><form id="v5-change" data-id="${id}"><div class="form-grid"><label class="field">事项日期<input name="date" type="date" required value="${esc(c.date)}"></label><label class="field">开始时间<input name="time" required maxlength="60" value="${esc(c.time)}" placeholder="例如09:00"></label></div><label class="field">新的范围与要求<textarea name="scope" required rows="3">${esc(c.scope)}</textarea></label><label class="field">变更原因<textarea name="reason" required rows="2" placeholder="例如来访时间提前，需要重排准备工作"></textarea></label><p class="quality-note">影响范围：总负责人及${c.departments.length}个部门、${tasks.filter(t=>t.commandId===id).length}项任务。原任务时限暂保留，由责任人重新核定；不自动猜测提前多久。</p><div class="drawer-actions"><button class="primary">保存变更并要求重新确认</button></div></form>`)}
function applyChange(c,fd){const before=c.date+' '+c.time+' / '+c.scope;c.date=String(fd.get('date'));c.time=String(fd.get('time')).trim();c.scope=String(fd.get('scope')).trim();c.revision=(c.revision||1)+1;c.resourceConfirmed=false;c.changePending=true;c.closed=false;c.departments.forEach(g=>{g.accepted=false;g.tasks.forEach(l=>l.delegated=false)});tasks.filter(t=>t.commandId===c.id).forEach(t=>{if(t.status==='已完成'||t.status==='待验收'||t.status==='待班组复核'||t.status==='待管理层验收'){t.status='进行中';t.progress=50}t.logs.push(['16:30','安排变更至第'+c.revision+'版，需重新确认时限与执行依据；历史验收保留。'])});c.logs.push(['16:30','变更：'+before+' → '+c.date+' '+c.time+' / '+c.scope+'；原因：'+String(fd.get('reason')).trim()]);}
staffPage=function(){const base=legacy.staffPage().replace('员工在岗','员工在岗');const extra=`<section class="content-panel coverage-panel"><div class="section-head"><h2>人手能否保障现场？</h2><span class="tag ${state.site==='A'?'amber':'teal'}">${state.site==='A'?'入口需协调':'按岗位持续确认'}</span></div><div class="coverage-grid"><div><b>关键岗位</b><p>${state.site==='A'?'入口10/12人在岗，排队约18分钟。补位与设备检查合并处理。':'目前无关键岗位未到预警；暂离岗位需确认替岗与返回时间。'}</p></div><div><b>可调配资源</b><p>机动2人是候选支援。需要核实技能、时段与原岗位有人值守，不能直接等同可用人手。</p></div><div><b>任务冲突</b><p>${directives.some(c=>c.site===state.site&&!c.resourceConfirmed)?'有指令资源待确认。先处理接待与正常服务的人员冲突。':'新增安排前，与已有班次和任务核对。'}</p></div></div><div class="drawer-actions">${state.site==='A'?'<button class="outline" data-entry>协调入口保障</button>':''}<button class="text-link" data-nav="command">检查指令人手和费用安排 →</button></div></section>`;return base.replace('<div class="staff-metrics">',extra+'<div class="staff-metrics">')};
supervisionPage=function(){const base=legacy.supervisionPage().replace('事情进展','事情进展'),atRisk=myTasks().filter(t=>overdue(t)||t.status==='遇到困难'),awaiting=myTasks().filter(t=>['待验收','待班组复核','待管理层验收'].includes(t.status));return base.replace('<div class="page-toolbar">',`<div class="coordination-strip"><div><b>${atRisk.length}项</b><span>逾期或遇到困难</span></div><div><b>${awaiting.length}项</b><span>等待验收</span></div><div><b>${directives.filter(c=>c.site===state.site&&!c.resourceConfirmed).length}条</b><span>指令资源待确认</span></div></div>${atRisk.length?`<section class="content-panel"><h2>优先解除卡住的事</h2>${atRisk.slice(0,3).map(taskRow).join('')}</section>`:''}<div class="page-toolbar">`)};
render=function(){const expanded=[...document.querySelectorAll('details[data-detail-key][open]')].map(d=>d.dataset.detailKey);legacy.render();document.querySelectorAll('details[data-detail-key]').forEach(d=>{if(expanded.includes(d.dataset.detailKey))d.open=true});document.querySelectorAll('#nav a').forEach(a=>{if(['#decisions','#data'].includes(a.getAttribute('href')))a.remove()});const badge=$('#nav a[href="#home"] .nav-count');if(badge)badge.remove();$('#nav').insertAdjacentHTML('beforeend','<div class="nav-utilities"><a href="#decisions">我选过的建议</a><a href="#data">数据说明</a></div>');};
resetExecutive=function(){legacy.resetExecutive();op={goals:{},entrance:{},outcomes:{},opportunity:{}};try{localStorage.removeItem(V5KEY)}catch{}};
function saveV5(){try{localStorage.setItem(V5KEY,JSON.stringify({op,tasks,selections,strategicChoices,directives,commandDrafts,selectedCommands,commandInputs,site:state.site}))}catch{}}
try{const data=JSON.parse(localStorage.getItem(V5KEY)||'null');if(data?.op&&Array.isArray(data.tasks)&&Array.isArray(data.directives)){op=data.op;tasks=data.tasks;selections=data.selections||{};strategicChoices=data.strategicChoices||{};directives=data.directives;commandDrafts=data.commandDrafts||{};selectedCommands=data.selectedCommands||{};commandInputs=data.commandInputs||{};if(['A','B','C'].includes(data.site))state.site=data.site}}catch{}
// Event handlers are specific to V5 controls; V2–V4 data tools stay available.
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-entry'))openEntry();if(b.hasAttribute('data-goal'))openGoal();if(b.hasAttribute('data-outcome'))openOutcome();if(b.dataset.resource)openResource(b.dataset.resource);if(b.dataset.change)openChange(b.dataset.change);if(b.hasAttribute('data-opportunity')){let t=tasks.find(t=>t.id===op.opportunity[state.site]);if(!t){t={id:'OP-'+state.site+'-'+tasks.length,site:state.site,title:'核对下周预订、团队与服务准备',owner:'综合负责人',due:'2026-08-31T18:00',status:'待接单',progress:0,note:'先补齐未来7天预订与关键岗位排班，不增加营销投放。',acceptance:'提交预订和服务准备差距；有依据时提出需决策的方案。',logs:[['16:30','经营者安排前瞻检查']]};tasks.push(t);op.opportunity[state.site]=t.id}render();openTask(t.id)}if(b.dataset.resultSample){if(b.dataset.resultSample==='missing'){op.outcomes[state.site]={complete:false};$('#detail').close();render();toast('数据不足：保留判断，先补齐资料')}else{const a=advisoryForSite(),base=state.site==='C'?8.4:74,factor=b.dataset.resultSample==='good'?.96:.80;const form=$('#v5-outcome');form.elements.actual.value=(base*factor).toFixed(2);form.elements.baseline.value=base;form.elements.cost.value=0;form.elements.note.value='构造的按相同规则统计后续样例，用于体验看效果；天气与客流结构影响待核实。'}}setTimeout(saveV5,0)});
document.addEventListener('submit',e=>{const f=e.target;if(!f.id.startsWith('v5-'))return;e.preventDefault();const fd=new FormData(f);if(f.id==='v5-goal'){const g=Number(fd.get('goal'));if(g<=0)return;op.goals[state.site]=g}if(f.id==='v5-entry'){const a=issues().find(a=>a.id==='frontline'),device=issues().find(a=>a.id==='device');if(!a)return;op.entrance.A={label:fd.get('choice')==='support'?'先核实原岗位有人值守，再调2名机动人员补位':'先复核现场，15分钟内回报',note:String(fd.get('note')).trim()};const t=createTaskFromIssue(a,op.entrance.A.note);t.due='2026-08-30T17:00';t.logs.push(['16:30',op.entrance.A.label+'；'+op.entrance.A.note]);createTaskFromIssue(device,'与入口补位并行检查设备，不认定离线必然等于故障。');selections[key(a.id)]={site:state.site,id:a.id,title:a.title,choice:'act',choiceTitle:op.entrance.A.label,note:op.entrance.A.note,at:Date.now()}}

 group:{name:'把工作日空档卖给团队',category:'闲时复游',badge:'先看接待余量',period:21,owner:'营销负责人',unit:'个新增团队',short:'用现有场地、导览和体验，做一款工作日预约产品。',evidence:()=>{const b=business();return `未来7天模拟预订中，前5天共${total(b.booking.slice(0,5))}单，周末两天共${total(b.booking.slice(5))}单。订单分布不能直接代表剩余接待容量。`},why:'工作日有真实空档、团队需求可触达时，优先用企业、社群、旅行社合作填空；不挤掉更高价值散客。',assumption:'20人一团，含基础票及适合该景区的集体体验；每团收入7200元、服务成本4300元、佣金300元是假设。试行最多6团需由运营确认。',offer:'固定人数、固定时间、固定服务清单的半日团体产品；不同类型团队分别说明活动内容和接待要求。',actions:[['现场运营负责人','确认工作日可接团的时段和人员','把场地、导览人员、接待上限及正常游客服务安排写清楚。',3],['营销负责人','形成团体报价，联系匹配的合作方','明确人数、时长、所含服务、改期和结算规则；先测试一个团队类型。',7],['现场运营负责人','复核每团成本和实际交付','记录加班、耗材、取消与散客影响，满额前复查接待能力。',21]],deliverable:'团体产品单、可订时段、报价成本表、合作线索与服务检查表。',measure:'按每个实际完成的新增团队核算，扣除额外人员和服务费用，检查被挤掉的散客贡献。',stop:'必须大量加班、占用正常游客核心体验，或实际成本超过报价空间时，调整人数与内容。',sources:['policy','channel'],calc:{type:'new',n:4,price:7200,cost:4300,fee:300,budget:2000,cap:6}},
 onsite:{name:'让园内消费更方便',category:'每单收入',badge:'先改一个点位',period:14,owner:'商业负责人',unit:'笔真正新增消费',short:'先把现有游客的真实需求接住，再增加商品和促销。',evidence:()=>{const d=current();return `今天模拟园内消费收款${fmt(d.pos)}元，对比日${fmt(d.posPrev)}元；收银${d.posN}笔。收银记录不能直接当作购买人数。`},why:'重点店铺销售走弱或游客找不到商品、营业时段不匹配时，先查商品、价格、位置和缺货情况。',assumption:'新增一笔消费收入35元、商品成本18元是假设。若店铺属于商户，收入必须改填景区应得分成，不能用商户整笔流水。',offer:'选择一个点位和一个需求：休息时的饮品、体验后的纪念品或方便携带的商品组合。设置明确价格和指引，不干扰游览。',actions:[['商业负责人','核对重点店铺与游客需求','检查营业时段、缺货、价格、陈列及真实反馈，排除收银缺漏。',2],['商业负责人','试改一个消费点位','选一组商品或一处指引；保留相似未调整点位，记录日客流与营业条件。',4],['商业负责人','扣除成本后看是否值得推广','比较同类日期与对照点位，排除从园内其他店铺转移来的消费。',14]],deliverable:'点位检查单、商品组合与价格、现场展示方案及景区所得测算。',measure:'用新增消费笔数与每笔所得算账，不用入园次数直接计算游客购买率。',stop:'只是把其他店铺订单转过来，库存损耗增加或投诉上升时，不扩大。',sources:['policy'],calc:{type:'new',n:150,price:35,cost:18,fee:0,budget:1200,cap:250}},

 onsite:[['先改哪一件事','选一个自营消费点，先检查游客是否找得到、有没有缺货、价格是否清楚。用现有商品试一个35元组合，本页默认成本按18元计算。'],['怎么试才看得明白','保持其他店铺规则，记录调整点和相似未调整点的每日收款、成本、缺货与营业时长。留意是否只是把其他店铺的订单转过来。'],['推广前的检查','新增150笔、每笔留下17元、额外准备费1,200元时，增加贡献1,350元。若是商户经营，用景区分成重算，不能把商户全额销售算作景区收入。']],
 repeat:[['具体再来理由','选择能提供不同体验的季节或路线，再设计指定日期回访权益。演示按第二次到访增加收入80元、服务成本25元算账，不把首访收入再算一遍。'],['谁适合收到邀请','优先选距离合适、体验满意且愿意接收信息的老游客。说明这次和上次有什么不同、适用日期与预约规则，不能只发一张便宜券。'],['次卡怎么避免亏','先小范围试两次卡，核算全部承诺次数的服务成本、原价销售被替代的影响和高峰占用。提前收到的钱不能直接当作已经赚到的收入。']]
};
function growthMaterialHTML(id){return `<details class="content-panel g-materials"><summary>拿来就能改的执行样例</summary><p class="source-caption">以下为方案素材示例，按真实资源核实后使用；示例报价对应初始参数，不会随右侧修改自动改写。</p>${growthMaterials[id].map(([t,b])=>`<article><h3>${t}</h3><p>${b.replaceAll('景区A','景区'+state.site)}</p></article>`).join('')}</details>`}

let growthView={tab:'ideas',filter:'全部',detail:null,compare:[]};
function growthState(){return op.growth||(op.growth={runs:[],settings:{},results:{},serial:0})}
function gkey(id){return state.site+':'+id}
function gsettings(id){return {...growthPlans[id].calc,...growthState().settings[gkey(id)]}}
function gruns(){return growthState().runs.filter(r=>r.site===state.site)}
function growthCalc(id,c){const p=growthPlans[id],unit=c.price-c.cost-c.fee;let gain,rev,breakEven,per;
 if(p.calc.type==='upgrade'){per=unit-(c.oldPrice-c.oldCost);const loss=(c.fullPrice-c.fullCost)-unit;gain=c.n*per-c.shift*loss-c.budget;rev=c.n*(c.price-c.oldPrice)+c.shift*(c.price-c.fullPrice);breakEven=per>0?Math.max(0,Math.ceil((c.budget+c.shift*loss)/per)):null}
 else{per=unit;gain=c.n*unit-c.budget;rev=c.n*c.price;breakEven=per>0?Math.ceil(c.budget/per):null}
 return {gain,rev,per,breakEven,within:c.n+(p.calc.type==='upgrade'?c.shift:0)<=c.cap};}
function growthOrder(){return state.site==='C'?['onsite','bundle','partner','media','group','repeat','ads']:state.site==='B'?['bundle','group','repeat','partner','media','onsite','ads']:['partner','media','bundle','group','onsite','repeat','ads']}
function growthSourcesHTML(p){return `<div class="g-sources">${p.sources.map(id=>{const s=growthSources[id];return `<div><a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.name} ↗</a><p>${s.note}</p></div>`}).join('')}</div>`}
function growthHeader(){return title('AI出主意','帮你找到增收机会，算清投入，再安排人去做')+`<div class="g-tabs">${[['ideas','找增收办法'],['doing','我安排的方案'],['results','看赚没赚到']].map(([id,n])=>`<button data-g-tab="${id}" class="${growthView.tab===id?'active':''}">${n}${id==='doing'&&gruns().length?` <span>${gruns().length}</span>`:''}</button>`).join('')}</div>`}
function growthIntro(){const b=business();return `<section class="g-intro"><div><span class="tag teal">景区${state.site} · 增收机会</span><h2>${state.site==='C'?'先接住园内消费，再考虑多花钱引流':state.site==='B'?'预订在增长，先提高每单收入、安排好闲时产品':'预订比参考一周少，先拓客源、把产品卖清楚'}</h2><p>${state.site==='C'?`园内消费7日收款7.10万元，比参考8.40万元少1.30万元。先查重点点位和产品组合。`:state.site==='B'?`未来7天已订${total(b.booking)}单，比参考${b.bookingPrev}单增加${((total(b.booking)/b.bookingPrev-1)*100).toFixed(1)}%。不必默认加广告，先确认哪些产品更赚钱。`:`未来7天已订${total(b.booking)}单，比参考${b.bookingPrev}单少${b.bookingPrev-total(b.booking)}单。优先比较周边合作、宣传内容与套餐。`}</p></div><aside><b>先选一个方向试</b><p>排序结合模拟经营信号和实施条件；不是收益保证。预算、成本和接待余量都可修改。</p><small>经营数据为模拟 · 外部资料用于参考做法</small></aside></section>`}
function growthCard(id,index){const p=growthPlans[id],c=gsettings(id),r=growthCalc(id,c),active=gruns().some(x=>x.plan===id&&x.status==='进行中');return `<article class="g-card"><div class="section-head"><span class="tag ${index<3?'teal':''}">${index<3?'优先看看':'备选方向'} · ${p.category}</span><label class="g-compare"><input type="checkbox" data-g-compare="${id}" ${growthView.compare.includes(id)?'checked':''}>对比</label></div><h2>${p.name}</h2><p>${p.short}</p><div class="g-card-proof"><b>为什么值得看</b><p>${p.evidence()}</p></div><div class="g-card-numbers"><div><small>试行费用示例</small><b>${fmt(c.budget)}元</b></div><div><small>计划观察</small><b>${p.period}天</b></div><div><small>覆盖费用需新增</small><b>${r.breakEven===null?'暂不成立':fmt(r.breakEven)+p.unit.replace('真正新增','').replace('新增','')}</b></div></div><div class="op-card-footer"><span>${active?'已有方案在执行':p.badge}</span><button class="primary" data-g-detail="${id}">看方案、算算账 →</button></div></article>`}
strategyPage=function(){if(growthView.detail)return growthDetail(growthView.detail);let html=growthHeader();if(growthView.tab==='ideas'){const order=growthOrder();return html+growthIntro()+`<div class="g-filterbar"><div>${['全部','客源','每单收入','闲时复游'].map(t=>`<button class="filter-button ${growthView.filter===t?'active':''}" data-g-filter="${t}">${t==='客源'?'让更多人来':t==='每单收入'?'让每单多赚':t==='闲时复游'?'闲时和回头客':t}</button>`).join('')}</div><button class="outline" data-g-comparison ${growthView.compare.length<2?'disabled':''}>对比已选方案（${growthView.compare.length}/3）</button></div><div class="g-cards">${order.filter(id=>growthView.filter==='全部'||growthPlans[id].category===growthView.filter).map(id=>growthCard(id,order.indexOf(id))).join('')}</div><p class="source-caption">本模块提供7类可执行方案。回本数按方案内的示例价格、成本和费用计算，不是行业平均值。不同方案可能带来同一批游客，收益不能直接相加。</p>`}return html+(growthView.tab==='doing'?growthDoing():growthResults())};
function growthDetail(id){const p=growthPlans[id],c=gsettings(id),r=growthCalc(id,c);return title('AI出主意 · 增收方案',p.name)+`<button class="text-link g-back" data-g-back>← 回到增收办法</button><section class="g-detail-hero"><span class="tag teal">${p.category} · ${p.period}天试行</span><h2>${p.name}</h2><p>${p.short}</p></section><div class="g-detail-layout"><div><section class="content-panel"><h2>凭什么建议你做</h2><div class="g-evidence"><span class="tag blue">景区数据 · 模拟</span><p>${p.evidence()}</p><span class="tag teal">适用条件</span><p>${p.why}</p><span class="tag amber">需要你确认的假设</span><p>${p.assumption}</p></div></section><section class="content-panel"><h2>具体卖什么，怎么做</h2><p class="g-offer">${p.offer}</p><ol class="g-actions">${p.actions.map(([owner,t,detail,day],i)=>`<li><span>${i+1}</span><div><h3>${t}</h3><small>${owner} · 第${day}天前</small><p>${detail}</p></div></li>`).join('')}</ol><div class="quality-note"><b>最后要拿到这些东西</b><p>${p.deliverable}</p></div></section>${growthMaterialHTML(id)}<section class="content-panel"><h2>怎样知道有没有多赚钱</h2><p>${p.measure}</p><div class="g-stop"><b>什么情况下停下来</b><p>${p.stop}</p></div></section><details class="content-panel"><summary>看看外部参考依据</summary>${growthSourcesHTML(p)}<p class="source-caption">外部依据说明方法或平台能力，不证明本景区的具体收益。当前未实时抓取商家账户或竞品经营数据。</p></details></div><aside><section class="content-panel g-calculator"><div class="section-head"><h2>先算这笔账</h2><span class="tag amber">可改假设</span></div><form id="g-calc" data-id="${id}"><label class="field">${p.calc.type==='upgrade'?'原本只买门票、现在升级的人数':'估计真正新增多少（'+p.unit+'）'}<input name="n" type="number" min="0" max="1000000" step="1" value="${c.n}" required></label>${p.calc.type==='upgrade'?`<label class="field">原本会单买齐项目、改买套餐的人数<input name="shift" type="number" min="0" max="1000000" step="1" value="${c.shift}" required></label>`:''}<label class="field">这次额外准备、宣传或投放费（元）<input name="budget" type="number" min="0" max="10000000" step="1" value="${c.budget}" required></label><details class="g-costs"><summary>修改售价、成本和接待上限</summary>${[['price','每'+(p.calc.type==='upgrade'?'份套餐':'个成交单位')+'收入（元）'],['cost','每单位商品和接待成本（元）'],['fee','每单位佣金等费用（元）'],['cap','这次最多能接待或提供多少单位']].map(([name,label])=>`<label class="field">${label}<input name="${name}" type="number" min="0" max="10000000" step="${name==='cap'?'1':'0.01'}" value="${c[name]}" required></label>`).join('')}${p.calc.type==='upgrade'?[['oldPrice','原门票售价'],['oldCost','原门票对应成本'],['fullPrice','原本单买齐项目的售价'],['fullCost','原本单买齐项目的成本']].map(([name,label])=>`<label class="field">${label}（元）<input name="${name}" type="number" min="0" max="10000000" step="0.01" value="${c[name]}" required></label>`).join(''):''}</details><button class="outline" type="submit">按这些数重新算</button></form><div id="g-calculation">${growthCalculationHTML(id,c)}</div><button class="primary g-start" data-g-start="${id}" ${!r.within||r.per<=0?'disabled':''}>${gruns().some(x=>x.plan===id&&x.status==='进行中')?'查看已安排的方案':'按这个方案安排人做'}</button><p class="source-caption">按你填的假设计算经营贡献，扣除本方案变动成本和额外费用；未分摊全部固定成本及税费，不等于净利润。</p></section></aside></div>`}
function growthCalculationHTML(id,c){const p=growthPlans[id],r=growthCalc(id,c);return `<div class="g-calc-result ${r.gain<0?'negative':''}"><small>按当前假设，预计增加经营贡献</small><strong>${r.gain>=0?'+':'−'}${fmt(Math.abs(r.gain))}<em>元</em></strong><p>预计增加收入 ${fmt(r.rev)}元</p></div><div class="tiny-pairs"><span>每${p.calc.type==='upgrade'?'位升级游客多留下':'单位留下'}</span><b>${fmt(r.per)}元</b><span>覆盖本次费用需要</span><b>${r.breakEven===null?'售价与成本需调整':r.breakEven+p.unit.replace('真正新增','').replace('新增','')}</b></div><details class="g-formula"><summary>这个数怎么算的</summary><p>${p.calc.type==='upgrade'?`升级者：${c.n}×[(${c.price}−${c.cost}−${c.fee})−(${c.oldPrice}−${c.oldCost})]；原高价购买被替代：${c.shift}×[(${c.price}−${c.cost}−${c.fee})−(${c.fullPrice}−${c.fullCost})]；两者相加后减额外费用${c.budget}元。`:`${c.n}×（${c.price}−${c.cost}−${c.fee}）−${c.budget}＝${fmt(r.gain)}元。人数/订单只填估计真正新增的部分。`}</p></details><div class="g-scenarios"><small>不同新增量下的算账示例（不是预测区间）</small>${[.6,1,1.4].map((factor,i)=>{const cc={...c,n:Math.round(c.n*factor)},s=growthCalc(id,cc);return `<div><span>${['少一些','按当前','多一些'][i]} · ${cc.n}${p.unit.replace('真正新增','').replace('新增','')}</span><b>${fmt(s.gain)}元${s.within?'':' · 超接待上限'}</b></div>`}).join('')}</div>${!r.within?'<p class="g-warning">已超过本次接待上限，先减少数量或确认新增接待能力。</p>':r.per<=0?'<p class="g-warning">每多卖一份也不能增加贡献，请先调整价格、成本或产品。</p>':r.gain<0?'<p class="g-warning">当前假设下不能覆盖费用。可以调整方案，或明确按试验预算执行。</p>':''}`}
function openGrowthStart(id){const active=gruns().find(x=>x.plan===id&&x.status==='进行中');if(active){growthView.detail=null;growthView.tab='doing';render();return}const p=growthPlans[id],c=gsettings(id),r=growthCalc(id,c);if(!r.within||r.per<=0)return;v5Dialog('把增收方案安排下去',`<h3>${p.name}</h3><p class="intro-note">额外费用上限${fmt(c.budget)}元；预计${c.n}${p.unit}是待验证假设。${r.gain<0?'当前测算不能回本，本次只能作为有明确预算的试验。':''}</p><form id="g-start" data-id="${id}"><label class="field">谁总负责<select name="owner">${owners.map(o=>`<option ${o===p.owner?'selected':''}>${o}</option>`).join('')}</select></label><label class="field">开始日期<input name="date" type="date" required value="2026-08-31"></label><label class="field">这次最需要注意什么<textarea name="note" required rows="3">${p.stop}</textarea></label><label class="v5-check"><input type="checkbox" required>已核对适用条件、费用和接待能力，按小范围试行安排</label><div class="drawer-actions"><button class="primary">确认，生成3件执行任务</button></div></form><p class="source-caption">仅创建本地模拟任务，不投放广告、不发布内容、不联系商家。</p>`)}
function growthDoing(){const rs=gruns();if(!rs.length)return `<section class="content-panel g-empty"><h2>选好方案，就能安排人做</h2><p>费用、负责人、交付材料和检查日期会跟着方案一起记录。</p><button class="primary" data-g-tab="ideas">去选增收办法</button></section>`;return `<p class="intro-note">并行方案可能面向同一批游客；费用需合并管理，预计收益不能直接相加。</p>${rs.slice().reverse().map(run=>{const p=growthPlans[run.plan],tt=run.status==='已结束'?(run.archivedTasks||[]):tasks.filter(t=>run.taskIds.includes(t.id));return `<section class="content-panel g-run"><div class="section-head"><div><span class="tag ${run.status==='进行中'?'blue':'teal'}">${run.status}</span><h2>${p.name}</h2></div><button class="text-link" data-g-detail="${run.plan}">回看方案 →</button></div><p>${esc(run.owner)}负责 · ${run.start}开始 · 额外费用上限${fmt(run.config.budget)}元</p><p class="source-caption">${esc(run.note)}</p>${tt.map(t=>run.status==='已结束'?`<details class="g-archived"><summary>${esc(t.title)} · ${esc(t.status)}</summary><p>${esc(t.owner)} · ${esc(t.acceptance)}</p><ol class="task-timeline">${t.logs.map(([time,msg])=>`<li><time>${time}</time><p>${esc(msg)}</p></li>`).join('')}</ol></details>`:taskRow(t)).join('')}${run.status==='已结束'?`<p class="source-caption">结束原因：${esc(run.endReason)}。执行记录已保留，未完成任务不再催办。</p>`:''}<div class="drawer-actions"><button class="primary" data-g-effect="${run.id}">看看赚没赚到</button>${run.status==='进行中'?`<button class="outline" data-g-end="${run.id}">结束这次试行</button>`:''}</div></section>`}).join('')}`}
function growthResults(){const rs=gruns();return rs.length?rs.slice().reverse().map(growthResultCard).join(''):`<section class="content-panel g-empty"><h2>每个方案都要算到结果</h2><p>选择方案后，这里会展示模拟效果，支持修改新增量、实际费用和判断依据。没有对照依据时，系统只给条件测算，不把相关订单说成增收成果。</p><button class="primary" data-g-tab="ideas">先看增收方案</button></section>`}
function growthResultCard(run){const p=growthPlans[run.plan],r=growthState().results[run.id]||{config:{...run.config},basis:'scenario',note:'自动展示按方案假设构造的模拟结果，不代表真实任务已完成。',adverse:false},calc=growthCalc(run.plan,r.config),done=(run.status==='已结束'?(run.archivedTasks||[]):tasks.filter(t=>run.taskIds.includes(t.id))).filter(t=>t.status==='已完成').length,reason=r.basis==='scenario'?'当前是模拟算账样例，先完成执行和对照检查，不据此扩大预算。':r.basis==='attributed'?'只有渠道标识或平台归因，不能证明这些全是新增；先补可比较的对照依据。':r.adverse?'先处理退款、投诉或接待问题，暂不扩大。':calc.gain<=0?'没有覆盖这次费用，暂停扩大；检查新增量不足、成本过高还是产品不合适。':!calc.within?'测算超过接待上限，先核实服务成本与接待能力。':'在所填新增量成立的前提下贡献为正；复查对照差异、退款和成本，再决定下一轮规模。';return `<section class="content-panel g-result"><div class="section-head"><h2>${p.name}</h2><span class="tag amber">${r.basis==='scenario'?'模拟效果示例':r.basis==='attributed'?'尚不能认定增收':'按填写的对照估计'}</span></div><p>${esc(run.owner)}负责 · ${done}/${run.taskIds.length}件任务完成${run.status==='已结束'?' · 已结束试行':''}</p><div class="g-result-grid"><div><small>${r.basis==='attributed'?'关联量（未证明新增）':'新增量假设 / 估计'}</small><b>${r.config.n}${p.unit}</b></div><div><small>额外费用</small><b>${fmt(r.config.budget)}元</b></div><div><small>${r.basis==='attributed'?'若全部为新增时的条件贡献':'按所填数字计算的贡献'}</small><b class="${calc.gain<0?'danger-text':''}">${fmt(calc.gain)}元</b></div></div><div class="decision-request"><b>AI建议下一步</b><span>${reason}</span></div><p class="source-caption">${esc(r.note)}</p><button class="outline" data-g-edit-result="${run.id}">修改结果和判断依据</button></section>`}
function openGrowthResult(id){const run=gruns().find(r=>r.id===id);if(!run)return;const stored=growthState().results[id],c=stored?.config||run.config,p=growthPlans[run.plan];v5Dialog('记录结果，再决定下一步',`<form id="g-result-form" data-id="${id}"><label class="field">这个新增量怎样得出<select name="basis"><option value="scenario">只是模拟算账样例</option><option value="attributed">渠道标识或平台归因，未证明新增</option><option value="comparison">通过可比对照估计（仍需核实其他影响）</option></select></label><label class="field">${p.calc.type==='upgrade'?'由只买门票改为升级的人数':'新增量估计 / 关联量'}<input name="n" type="number" min="0" max="1000000" step="1" value="${c.n}" required></label>${p.calc.type==='upgrade'?`<label class="field">原本会买齐、改买套餐的人数<input name="shift" type="number" min="0" max="1000000" step="1" value="${c.shift}" required></label>`:''}<div class="form-grid">${[['price','每单位实际收入'],['cost','每单位实际成本'],['fee','每单位佣金等费用'],['budget','这次实际额外费用']].map(([n,l])=>`<label class="field">${l}（元）<input name="${n}" type="number" min="0" max="10000000" step="0.01" value="${c[n]}" required></label>`).join('')}</div><label class="field">依据、比较周期和其他变化<textarea name="note" required rows="3" placeholder="例如：比较了相似日期或未参与组；天气、活动和退订有什么变化">${esc(stored?.note||'模拟结果；需核实对照条件、实际使用与退款。')}</textarea></label><label class="v5-check"><input name="adverse" type="checkbox" ${stored?.adverse?'checked':''}>出现退款、投诉或接待压力明显恶化</label><div class="drawer-actions"><button class="primary">保存，看看下一步怎么做</button></div></form>`);$('#g-result-form [name="basis"]').value=stored?.basis||'scenario'}
function openGrowthCompare(){const ids=growthView.compare;v5Dialog('把方案放在一起比较',`<p class="intro-note">比较适用条件、费用和回本要求。不同方案的新增单位不同，不能按示例收益简单排名。</p><div class="g-compare-list">${ids.map(id=>{const p=growthPlans[id],c=gsettings(id),r=growthCalc(id,c);return `<article><h3>${p.name}</h3><p>${p.why}</p><div class="tiny-pairs"><span>费用示例</span><b>${fmt(c.budget)}元</b><span>覆盖费用需要</span><b>${r.breakEven===null?'需调整':r.breakEven+p.unit.replace('真正新增','').replace('新增','')}</b><span>本方案单位</span><b>${p.unit}</b><span>观察周期</span><b>${p.period}天</b></div><button class="text-link" data-g-detail="${id}">看完整方案 →</button></article>`}).join('')}</div>`)}

const decisionsBeforeGrowth=decisionsPage;
decisionsPage=function(){let html=decisionsBeforeGrowth();const rs=gruns();if(!rs.length)return html;html=html.replace(/<div class="empty">[\s\S]*?<\/div>/,'');return html+`<section class="content-panel"><div class="section-head"><h2>我安排过的增收方案</h2><button class="text-link" data-nav="strategy" data-g-tab="doing">查看执行和效果 →</button></div>${rs.slice().reverse().map(r=>`<div class="g-history-row"><div><b>${growthPlans[r.plan].name}</b><p>${esc(r.owner)} · ${r.start}开始 · 费用上限${fmt(r.config.budget)}元</p></div><span class="tag">${r.status}</span></div>`).join('')}</section>`};

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.gTab){growthView.tab=b.dataset.gTab;growthView.detail=null;render();window.scrollTo({top:0})}if(b.dataset.gFilter){growthView.filter=b.dataset.gFilter;render()}if(b.dataset.gDetail){growthView.detail=b.dataset.gDetail;$('#detail').close();render();window.scrollTo({top:0})}if(b.hasAttribute('data-g-back')){growthView.detail=null;render();window.scrollTo({top:0})}if(b.hasAttribute('data-g-comparison'))openGrowthCompare();if(b.dataset.gStart)openGrowthStart(b.dataset.gStart);if(b.dataset.gEffect){growthView.tab='results';growthView.detail=null;render();window.scrollTo({top:0})}if(b.dataset.gEditResult)openGrowthResult(b.dataset.gEditResult);if(b.dataset.gEnd)openGrowthEnd(b.dataset.gEnd)});
document.addEventListener('change',e=>{if(e.target.dataset.gCompare){const id=e.target.dataset.gCompare;if(e.target.checked&&growthView.compare.length<3)growthView.compare.push(id);else if(!e.target.checked)growthView.compare=growthView.compare.filter(x=>x!==id);else toast('一次最多比较3个方案');render()}if(e.target.id==='site'){growthView.detail=null;growthView.compare=[];render()}});
