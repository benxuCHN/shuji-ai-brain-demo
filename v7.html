 if(f.id==='g-calc'){const c=gsettings(id);for(const [key,value]of fd){const n=Number(value);if(!Number.isFinite(n)||n<0){toast('请输入有效的非负数字');return}c[key]=n}growthState().settings[gkey(id)]=c;render();toast('已按这些假设重新算账')}
 if(f.id==='g-start'){if(gruns().some(r=>r.plan===id&&r.status==='进行中'))return;const p=growthPlans[id],config=gsettings(id),calc=growthCalc(id,config);if(!calc.within||calc.per<=0)return;const start=String(fd.get('date')),run={id:'ZS-'+state.site+'-'+(++growthState().serial),site:state.site,plan:id,config:{...config},owner:String(fd.get('owner')),start,note:String(fd.get('note')).trim(),status:'进行中',taskIds:[]};p.actions.forEach(([owner,title,acceptance,day],i)=>{const tid=run.id+'-'+(i+1);run.taskIds.push(tid);tasks.push({id:tid,site:state.site,growthRun:run.id,title,owner,due:datePlus(start,day-1),status:'待接单',progress:0,note:p.offer+' 总负责人：'+run.owner+'；费用总上限'+config.budget+'元，不是每个任务各有一份预算。',acceptance,logs:[['16:30','从增收方案“'+p.name+'”建立任务']]})});growthState().runs.push(run);$('#detail').close();growthView.detail=null;growthView.tab='doing';render();window.scrollTo({top:0});toast('已建立3件本地模拟任务')}
 if(f.id==='g-result-form'){const run=gruns().find(r=>r.id===id);if(!run)return;const c={...run.config};for(const key of ['n','shift','price','cost','fee','budget'])if(fd.has(key))c[key]=Number(fd.get(key));if(Object.values(c).some(v=>typeof v==='number'&&(!Number.isFinite(v)||v<0)))return;growthState().results[id]={config:c,basis:String(fd.get('basis')),note:String(fd.get('note')).trim(),adverse:fd.has('adverse')};$('#detail').close();render();toast('效果和依据已保存')}
 if(f.id==='g-end-form'){const run=gruns().find(r=>r.id===id);if(!run)return;run.status='已结束';run.endReason=String(fd.get('reason')).trim();run.archivedTasks=structuredClone(tasks.filter(t=>run.taskIds.includes(t.id)));tasks=tasks.filter(t=>!run.taskIds.includes(t.id));$('#detail').close();render();toast('执行记录已保留，未完成任务停止推进')}saveV5()});

// Percentage changes open an evidence-led analysis. All figures remain simulated.
function changeInfo(k){const d=current(),value=d[k],previous=d[k+'Prev'],valid=value!=null&&previous!=null&&Number.isFinite(value)&&Number.isFinite(previous),p=valid?percent(value,previous):null,diff=valid?value-previous:null;return {value,previous,p,diff,directionTone:p===null||p===0?'neutral':p>0?'positive':'risk',tone:p===null||p===0?'neutral':(k==='refund'?p>0:p<0)?'risk':'positive',direction:p===null?'暂无可比比例':p>0?'增长':p<0?'下降':'持平'}}
function changeButton(k){const c=changeInfo(k);return `<button class="change-button ${c.directionTone}" data-change-metric="${k}" aria-label="${metrics[k].name}${c.direction}${c.p===null?'':Math.abs(c.p).toFixed(1)+'%'}，查看分析和建议"><b>${c.p===null?'—':c.p>0?'↑':c.p<0?'↓':'—'} ${c.p===null?'暂无可比比例':Math.abs(c.p).toFixed(1)+'%'}</b><span>看分析 →</span></button><small class="change-period">较上周同日同时段</small>`}
homeDataBoard=function(){const d=current();return `<section class="home-data-board" aria-label="经营数据看板"><div class="section-head"><div><h2>经营数据看板</h2><p>景区${state.site} · 08/30 截至16:30 · 模拟数据</p></div><button class="primary" data-nav="overview">查看完整数据看板 →</button></div><div class="home-data-grid">${['paid','entry','orders','refund','pos','parking'].map(k=>`<article class="home-data-metric"><button class="metric-value-button" data-home-metric="${k}" aria-label="${metrics[k].name}，查看趋势"><span>${metrics[k].name}</span><strong>${fmt(d[k])}<small>${metrics[k].unit}</small></strong></button>${changeButton(k)}</article>`).join('')}</div><p class="home-data-note">点击高亮比例，查看变化分析与改进建议。绿色表示增长，红色表示下降，灰色表示持平或不可比；金额按各自口径展示，不直接相加。</p></section>`};
kpi=function(k){const d=current(),m=metrics[k];return `<article class="kpi-card ${state.metric===k?'selected':''}"><button class="metric-value-button" data-metric="${k}" aria-label="${m.name}，查看分时趋势"><div class="kpi-top"><span>${m.name}</span><span>↗</span></div><strong class="kpi-number">${d[k]===null?'—':fmt(d[k])}<small>${d[k]===null?'':m.unit}</small></strong></button>${changeButton(k)}</article>`};
function changeAdvice(k){const c=changeInfo(k),d=current(),r=c.tone==='risk',positive=c.p!==null&&c.p!==0&&!r;const common='先核对相同星期、营业时段、天气、节假日与数据覆盖；单日变化不等于持续趋势。';const cfg={
 paid:{meaning:r?'门票收款减少，先分清是订单少了，还是每单收款变了。':positive?'门票收款增加，先确认增长来源和扣除成本后的贡献。':'先确认比较基数与正常波动，再决定是否调整经营。',facts:[`当日付款${fmt(d.orders)}单，对比日${fmt(d.ordersPrev)}单，变化${percent(d.orders,d.ordersPrev).toFixed(1)}%。`,...(d.orders>0&&d.ordersPrev>0?[`按同一支付日口径，每单收款${fmt(d.paid/d.orders)}元，对比日${fmt(d.paidPrev/d.ordersPrev)}元；这是每笔订单金额，不是游客人均消费。`]:[])],unknown:'当前只有渠道收款构成，没有各渠道前期明细、票型变化与费用，尚不能定位下降或增长来自哪一个渠道。',steps:r?[['先查购票流程和订单差额','票务负责人','按渠道与票型对比同一支付周期；走一遍咨询、预约和支付流程，排除缺票、下架和支付故障。'],['只改善已确认的薄弱环节','营销负责人','流程问题先修复；客源不足再选一个客群试内容或周边合作，不直接全渠道降价。'],['按一周可比数据看结果','经营负责人','记录有效订单、每单收款、退款和费用；用对照或相似营业日核实新增贡献。']]:[['找出增长从哪里来','票务负责人','补齐各渠道、票型及折扣的前后对照，核查是否集中付款或一次性团队订单。'],['保留有效做法，小范围复制','营销负责人','只扩大已核实贡献为正且有接待余量的渠道，不把收款增长直接当利润增长。'],['把退款与贡献一起复盘','经营负责人','观察后续核验、退款、佣金及服务成本；增长质量稳定后再决定投入。']],plans:['media','partner']},
 orders:{meaning:r?'付款订单减少，先查哪些购票环节或渠道少了订单。':'付款订单增加，关注是否带来有效到访与更好的经营贡献。',facts:[`本期付款${fmt(d.orders)}单，门票收款${fmt(d.paid)}元。`,`对比日付款${fmt(d.ordersPrev)}单，门票收款${fmt(d.paidPrev)}元。`],unknown:'缺少曝光、点击、支付失败与渠道前期订单数据，无法判断是流量变化还是购票转化变化。订单数也不等于游客人数。',steps:[['补齐渠道购买路径','票务负责人','分渠道查看访问、下单、支付及取消记录，区分订单量与每单票数。'],[r?'修复一个购票障碍':'保留有效的购买路径','营销负责人',r?'修复明确的支付、信息或预约障碍；若流量不足，再用一个客群做小范围宣传。':'核实新增订单不是异常拆单或过度低价；确认接待能力后再复制有效渠道。'],['跟踪支付后的质量','经营负责人','按同一批订单观察核验、退款、每单贡献与投诉；不只追求订单笔数。']],plans:['media','partner']},
 entry:{meaning:r?'入园核验减少，需区分客流变化与记录问题。':'入园核验增加，先保障通行和接待，再寻找消费机会。',facts:[`当日入园核验${fmt(d.entry)}次，门票收款${fmt(d.paid)}元。`,'购票日期与入园日期可能不同，不能拿当天收款除以检票次数推断客单价。'],unknown:'需补充小时、入口、票型及首次核验明细；重复进出、多人票、预售票使用都会影响判断。',steps:[['核对核验记录和客流时段','现场运营负责人','按入口、小时与首次核验口径核对数据，区分设备回补与真实到访。'],[r?'核实到访减少的原因':'按高峰安排通行与服务','现场运营负责人',r?'结合天气、团队取消与未来预订核查；不能仅凭检票减少就增加广告。':'核对岗位覆盖、设备与排队时长，先用现有人手支援高峰，不牺牲安全与服务。'],['把到访与体验一起复盘','经营负责人','观察排队、投诉和消费点营业情况；新增核验不自动代表新增收入。']],plans:r?['partner','media']:['onsite']},
 refund:{meaning:r?'退款金额增加，优先核对原订单和原因，控制可避免的服务损失。':'退款金额减少，先确认不是延期到账或记录缺漏，再保留有效做法。',facts:[`本期记录成功退款${d.refundN}笔，金额${fmt(d.refund)}元。`,'退款可能来自以前购买的订单；这里的涨跌是金额变化，不是退款率。'],unknown:'缺少统一售出批次、对比期退款笔数和原因明细，不能判断是退款人数增多、单笔金额变大还是集中处理。',steps:[['分清正常退款和可修复问题','票务负责人','关联原订单日期与匿名退款原因，区分天气、正常退改、规则误解和无法履约。'],[r?'先修复游客买了却用不了的问题':'确认没有延迟或阻碍合理退款','现场运营负责人',r?'检查预约名额、营业时间和兑换规则；修正文案与现场服务，不限制合理退款。':'核对支付渠道到账时差、积压申请和客服反馈，避免把延迟退款当成改善。'],['按同批订单观察后续退款','经营负责人','用同一售出批次和足够观察窗口复盘，兼看投诉与兑现情况，不把全部退款差额当作可挽回收入。']],plans:[]},
 pos:{meaning:r?'园内消费收款下降，先查哪些店铺、时段和商品出了变化。':'园内消费收款增长，核对商品成本与景区实际分成后再扩大。',facts:[`本期收银${d.posN}笔，平均每笔${fmt(d.pos/d.posN)}元；缺少对比期笔数，暂不能判断每笔消费的变化。`,...d.shops.map(([n,v])=>`${n}本期收款${fmt(v)}元；目前无该店前期明细。`)],unknown:'没有前期店铺、订单笔数、营业时段与库存数据，无法把收款变化归因于客单价或消费转化率。商户流水也不等于景区收入。',steps:[['先走查一个重点消费点','商业负责人','核对营业时段、缺货、价签、支付排队与动线指引，对照同类营业日。'],[r?'优先修复看不到、买不到的问题':'只复制高贡献且供货稳定的做法','商业负责人',r?'选择一个点位和一种需求，调整导引或商品呈现，一次只改一个因素。':'核实自营成本或商户分成，并确认库存与服务能力；不只追求商户流水。'],['核对多卖之后景区多得多少','经营负责人','记录新增有效收银、成本、分成、活动费用及投诉，区分原有订单转移。']],plans:['onsite']},
 parking:{meaning:r?'停车收款减少，先核对车辆、收费规则和支付记录。':'停车收款增加，先确认来自真实车流或正常收费，兼顾通行效率。',facts:[`本期入场${d.carIn}车次、出场${d.carOut}车次，停车收款${fmt(d.parking)}元。`,'进出场与支付并非逐笔一一对应，跨日停车、免费车辆和优惠都需分开核对。'],unknown:'缺少对比期车流、停车时长、减免和设备异常明细，不能认定漏收或直接建议涨价。',steps:[['核对收费与匿名进出流水','现场运营负责人','区分跨日停车、免费车辆、优惠、退款及异常放行；核对金额单位和支付日期。'],['修复确认的收费或通行问题','现场运营负责人','优先处理设备与记录缺漏，保持收费公示和合理减免，不因收款波动擅自调价。'],['同时跟踪收款和服务','经营负责人','记录收费差异是否缩小、出口排队与投诉是否改善，再决定是否调整流程。']],plans:[]}
 };const a=cfg[k];return {...a,meaning:c.p===null?'当前没有可比比例，先核对数据与基数，不判断经营好坏。':c.p===0?'当前与参考时段持平，保持观察，不必仅为平稳数据追加投入。':a.meaning,common}}
function openChangeAnalysis(k){if(!metrics[k])return;const m=metrics[k],c=changeInfo(k),a=changeAdvice(k),issue=issues().find(x=>x.id===k);v5Dialog(m.name+' · 变化分析',`<div class="change-verdict ${c.directionTone}"><span>${c.p===null?'暂无可比比例':c.direction+' '+Math.abs(c.p).toFixed(1)+'%'}</span><h3>${a.meaning}</h3><p>08/30与08/23 · 均截至16:30 · 模拟经营数据</p></div><div class="change-facts"><div><small>当前</small><strong>${c.value==null?'—':fmt(c.value)}<em>${m.unit}</em></strong></div><div><small>上周同日同时段</small><strong>${c.previous==null?'—':fmt(c.previous)}<em>${m.unit}</em></strong></div><div><small>差额</small><strong>${c.diff==null?'—':(c.diff>0?'+':'')+fmt(c.diff)}<em>${m.unit}</em></strong></div></div><section class="detail-section"><h3>数据告诉了我们什么</h3><ul class="change-evidence">${a.facts.map(t=>`<li>${t}</li>`).join('')}</ul><p class="source-caption">${a.common}</p></section><section class="detail-section"><h3>原因还要核实</h3><p>${a.unknown}</p><p class="source-caption">以下为待验证的改进方向，不代表已确认原因或收益预测。</p></section><section class="detail-section"><h3>建议接下来这样做</h3><ol class="change-steps">${a.steps.map(([t,o,desc],i)=>`<li><b>${i+1}</b><div><h4>${t}</h4><p>${desc}</p><small>建议负责人：${o}</small></div></li>`).join('')}</ol><div class="drawer-actions"><button class="primary" data-change-assign="${k}">把这三步安排下去</button>${issue?`<button class="outline" data-change-existing="${k}">查看现有异常处理</button>`:''}</div></section>${a.plans.length?`<section class="detail-section"><h3>需要持续改善，可以看这些方案</h3><p class="source-caption">先核实适用条件，再测算费用与贡献。数据波动不会自动增加预算。</p>${a.plans.map(id=>`<button class="change-plan" data-change-plan="${id}"><span>${growthPlans[id].name}</span><b>看做法与投入 →</b></button>`).join('')}</section>`:''}<details class="source-details"><summary>查看统计口径与数据依据</summary><p>${m.rule}</p><p>${m.caution}</p><p>涨跌比例＝（当前−参考值）÷参考值。参考值为0或缺失时不计算比例；退款按金额变化判断，不作退款率。</p><p>对应数据：${m.table}。当前全部为模拟数据，真实原因需结合明细与经营背景确认。</p></details>`)}
function openChangeAssign(k){const a=changeAdvice(k),existing=myTasks().filter(t=>t.changeMetric===k&&t.status!=='已完成');if(existing.length){v5Dialog('已有这项数据的跟进任务',`<p>${metrics[k].name}已有${existing.length}项任务未完成，继续跟进即可。</p><div class="drawer-actions"><button class="primary" data-nav="supervision" data-close>查看事情进展</button></div>`);return}v5Dialog('安排改进步骤',`<p class="intro-note">${metrics[k].name} · 3项核查与改进任务。仅记录本地模拟任务，不向真实员工发送通知。</p><form id="change-assign-form" data-key="${k}"><label class="field">谁总负责<select name="owner">${owners.map(o=>`<option>${esc(o)}</option>`).join('')}</select></label><label class="field">本轮检查完成日期<input type="date" name="due" required value="2026-08-31"></label><ol class="change-evidence">${a.steps.map(([t])=>`<li>${t}</li>`).join('')}</ol><label class="field">补充说明<textarea name="note" rows="2" maxlength="600" placeholder="例如：先核查明细，经营会上再决定投入"></textarea></label><button class="primary">确认建立3项任务</button></form>`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.changeMetric)openChangeAnalysis(b.dataset.changeMetric);if(b.dataset.changeAssign)openChangeAssign(b.dataset.changeAssign);if(b.dataset.changeExisting)openAnomaly(b.dataset.changeExisting);if(b.dataset.changePlan){$('#detail').close();growthView.tab='ideas';growthView.detail=b.dataset.changePlan;navigate('strategy');}});
document.addEventListener('submit',e=>{if(e.target.id!=='change-assign-form')return;e.preventDefault();const k=e.target.dataset.key;if(!metrics[k]||myTasks().some(t=>t.changeMetric===k&&t.status!=='已完成'))return;const fd=new FormData(e.target),due=String(fd.get('due')),owner=String(fd.get('owner'));if(!/^\d{4}-\d{2}-\d{2}$/.test(due)||!owners.includes(owner))return;const a=changeAdvice(k),c=changeInfo(k),batch='FX-'+state.site+'-'+Date.now();a.steps.forEach(([title,role,acceptance],i)=>tasks.push({id:batch+'-'+i,site:state.site,changeMetric:k,issueId:'change-'+k,title:metrics[k].name+'：'+title,owner,due:due+'T18:00',status:'待接单',progress:0,note:`建议协作角色：${role}。分析依据：当前${fmt(c.value)}${metrics[k].unit}、参考${fmt(c.previous)}${metrics[k].unit}，${c.direction}${c.p==null?'':Math.abs(c.p).toFixed(1)+'%'}；均为模拟。${String(fd.get('note')||'')}`,acceptance,logs:[['16:30','由高亮比例的变化分析建立改进任务；不代表已核实原因。']]}));saveV5();$('#detail').close();navigate('supervision');toast('已建立3项本地模拟任务')});
render();

</script></body></html>
