function growthCalculation(x){const keys=['n','price','cost','commission','expense','loss','capacity','budget'];if(keys.some(k=>!Number.isFinite(x[k])||x[k]<0||x[k]>1000000000)||!Number.isInteger(x.n)||!Number.isInteger(x.capacity))return {valid:false};const unit=x.price-x.cost-x.commission,contribution=x.n*unit-x.expense-x.loss,breakeven=unit>0?Math.ceil((x.expense+x.loss)/unit):null;return {valid:true,unit,contribution,breakeven,overBudget:x.expense>x.budget,overCapacity:x.n>x.capacity,unreachable:breakeven!==null&&breakeven>x.capacity}}
function growthCardSnippet(id){let m=GROWTH[id];if(!m)return '';let r=growthCalculation(m.defaults);return `<div class="round-summary"><strong>模拟试算</strong> · 增量贡献 ¥${fmt(r.contribution)}<br>覆盖费用需 ${r.breakeven==null?'无法回本':fmt(r.breakeven)+' '+m.unit}；点开可调整假设。</div>`}

const change=(k,now,prev)=>{let n=pct(now,prev);return `<button class="change ${n==null?'':n>=0?'up':'down'}" data-action="metric" data-id="${k}" title="查看这项变化的原因与建议">${n==null?'缺少可比数据':`${n>=0?'↑':'↓'} ${Math.abs(n*100).toFixed(1)}%`}</button>`};
const pill=(text,kind='')=>`<span class="pill ${kind}">${esc(text)}</span>`,btn=(name,action,id='',cls='')=>`<button class="btn ${cls}" data-action="${action}" data-id="${id}">${name}</button>`;
const sourceTag=()=>state.uploaded?'上传表格':'模拟数据';
const localDate=(offset=0)=>{let d=new Date();d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function dueOffset(label){if(/当天|发现后|确认后|修复后|后\s*\d+\s*(分钟|小时)/.test(label))return 0;let m=String(label).match(/第\s*(\d+)/);return m?Math.max(0,Number(m[1])-1):1}
function makeTask(plan,id,round,demo=false){let x=EXECUTION[plan][id],start=state.rounds[round]?.start;return {title:x.title,owner:x.owner,status:'待确认',due:x.due,dueDate:start?dateFrom(start,dueOffset(x.due)):localDate(dueOffset(x.due)),plan,round,feedback:'',evidence:'',acceptanceNote:'',checklist:[...x.checklist],done:x.checklist.map(()=>false),proof:x.proof,acceptance:x.acceptance,demo}}
function hydrateTasks(){for(let t of state.tasks){if(!t.checklist){let list=EXECUTION[t.plan]||[],old=DEMO.plans[t.plan]?.steps||[],i=old.findIndex(x=>x[1]===t.title),x=list[Math.max(0,i)];t.checklist=x?[...x.checklist]:['确认这件事的负责人和完成时间','记录具体做了什么','向经营者回报结果'];t.done=t.checklist.map(()=>t.status==='已验收');t.proof=x?.proof||'执行记录或可核对的结果';t.acceptance=x?.acceptance||'负责人回报，经营者确认结果';t.evidence=t.evidence||'';t.acceptanceNote=t.acceptanceNote||'';t.dueDate=t.dueDate||localDate(1);t.round=t.round||`旧版任务-${t.plan||'安排'}`}}if(!state.tasks.length){let round='示例执行单-售票入口';state.tasks=EXECUTION.listing.map((_,i)=>makeTask('listing',i,round,true));state.tasks[0].status='处理中';state.tasks[0].done[0]=true}save()}
const doneCount=t=>(t.done||[]).filter(Boolean).length;
function toast(s){let x=$('#toast');x.textContent=s;x.classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>x.classList.remove('visible'),3200)}
function drawer(title,body){$('#drawer-title').textContent=title;$('#drawer-body').innerHTML=body;if(!$('#drawer').open)$('#drawer').showModal()}function close(){if($('#drawer').open)$('#drawer').close()}
function go(v){state.view=nav.some(x=>x[0]===v)?v:'home';location.hash=state.view;render();window.scrollTo(0,0);document.body.classList.remove('nav-open')}
function header(title,sub,buttons=''){return `<div class="page-head"><div><div class="eyebrow">${siteName()} · ${state.mode==='pilot'?'试点版':'完整产品'} · ${state.uploaded?'表格数据':'模拟数据'}</div><h1>${title}</h1><p>${sub}</p></div><div class="head-actions">${buttons}</div></div>`}
function kpiCards(){return `<div class="kpi-grid">${Object.entries(DEMO.metrics).map(([k,m])=>{let x=metric(k);return `<div class="card kpi"><div class="kpi-name">${m.name}</div><div class="kpi-value">${fmt(x.now)}<span class="kpi-unit">${m.unit}</span></div>${change(k,x.now,x.prev)}<div class="kpi-note">${state.uploaded&&x.source==='上传表格'?'来自本次上传':'演示数据'} · 对比同星期</div></div>`}).join('')}</div>`}
function issueRows(limit=99){return DEMO.issues.slice(0,limit).map(i=>`<div class="issue-row"><div class="issue-icon ${i.level}">${i.level==='red'?'!':'↗'}</div><div><div class="inline-meta">${pill(i.level==='red'?'先处理':'要关注',i.level)}${pill('模拟线索','mock')}<span>${i.owner}</span></div><h3>${i.title}</h3><p>${i.signal}</p><div class="tiny">依据：${i.source}</div></div>${btn('看分析和改法 →','issue',i.id)}</div>`).join('')}
function trendSvg(){let v=DEMO.trend,lo=Math.min(...v)-1000,hi=Math.max(...v)+1000;let points=v.map((x,i)=>`${i*500/(v.length-1)},${112-(x-lo)/(hi-lo)*100}`).join(' ');return `<svg class="spark" viewBox="0 0 500 120" role="img" aria-label="模拟的14天门票收款趋势"><defs><linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#83c5b6" stop-opacity=".3"/><stop offset="1" stop-color="#83c5b6" stop-opacity="0"/></linearGradient></defs><polygon points="0,120 ${points} 500,120" fill="url(#fade)"/><polyline points="${points}" fill="none" stroke="#388e84" stroke-width="3" stroke-linecap="round"/><circle cx="500" cy="${112-(v.at(-1)-lo)/(hi-lo)*100}" r="5" fill="#cb4454"/></svg>`}
function home(){let tasks=state.tasks.filter(t=>t.status!=='已验收');return header('今天先看这几件事','先看数据，再处理需要决策的问题。示例日期：2026年6月28日。',btn('查看完整看板','go','board','primary'))+`<div class="summary-strip"><strong>AI 今日提醒：先核对日报和售票入口，再决定是否扩大投放。</strong><p>门票收款较可比日下降 20%，但园内消费增长 16.4%；原因仍需核查。${state.uploaded?'经营数字来自本次上传，问题线索仍为模拟。':'以下经营数字、问题和任务均为模拟。'}</p></div>${kpiCards()}<div class="two-col"><div class="stack"><section class="card"><div class="card-head"><h2>需要你决定的问题</h2>${btn('查看全部','go','issues','link')}</div>${issueRows(4)}</section><section class="card"><div class="card-head"><h2>最近 14 天门票收款</h2>${pill('模拟趋势','mock')}</div>${trendSvg()}<div class="chart-labels"><span>6月15日</span><span>6月21日</span><span>6月28日</span></div><div class="note">同星期比较只是一条线索。遇到闭园、天气、节假日变化，应先核对是否可比。</div></section></div><div class="stack"><section class="card"><div class="card-head"><h2>督办事项</h2>${btn('去看进展','go','tasks','link')}</div><div class="mini-row"><span>待处理／进行中</span><strong>${tasks.length} 件</strong></div>${tasks.slice(0,3).map(t=>`<div class="mini-row"><span>${esc(t.title)}</span>${pill(t.status,t.status==='已验收'?'green':'amber')}</div>`).join('')}</section><section class="card"><div class="card-head"><h2>员工在岗</h2>${btn('看各岗位','go','staff','link')}</div><div class="roster-summary"><span class="roster-number">61<small> / 64 人</small></span><span class="tiny">请假 2 人 · 未确认 1 人<br>先核实关键岗位有无空缺</span></div><div class="task-progress"><span style="width:95.3%"></span></div></section><section class="card"><div class="card-head"><h2>一句话安排工作</h2>${btn('完整流程','go','command','link')}</div><p class="tiny">说一件事，拆成负责人、动作、反馈和验收。</p><div class="quick-command"><input id="home-command" placeholder="例如：明天有检查，准备好接待和安全巡查"><button class="btn primary" data-action="quick-command">生成安排</button></div></section></div></div>`}
function board(){let c=DEMO.channels,p=DEMO.products;return header('数据看板','钱从哪里来，哪些产品在变化。点击涨跌数字看分析；各项业务收款不可随意相加。',btn('上传景区表格','go','sources','primary'))+kpiCards()+`<div class="two-col"><div class="stack"><section class="card"><div class="card-head"><h2>各渠道卖得怎么样</h2>${pill(state.uploaded?'渠道仍为模拟':'模拟数据','mock')}</div><div class="table-wrap"><table><thead><tr><th>渠道</th><th>门票收款</th><th>同星期变化</th><th>订单</th><th>退款发生额</th><th>渠道／投放费用</th></tr></thead><tbody>${c.map(x=>`<tr><td>${x.name}</td><td>¥${fmt(x.now)}</td><td>${change('paid',x.now,x.prev)}</td><td>${x.orders}</td><td>¥${fmt(x.refund)}</td><td>¥${fmt(x.fee)}</td></tr>`).join('')}</tbody></table></div><div class="note">本示例四个渠道门票收款合计 ¥38,400。费用性质各不相同，须按合同核对，不能直接用收款减费用当利润。</div></section><section class="card"><div class="card-head"><h2>卖的是什么票</h2>${pill('模拟数据','mock')}</div><div class="table-wrap"><table><thead><tr><th>票种</th><th>门票收款</th><th>同星期变化</th><th>订单</th><th>核验说明</th></tr></thead><tbody>${p.map(x=>`<tr><td>${x.name}</td><td>¥${fmt(x.now)}</td><td>${change('paid',x.now,x.prev)}</td><td>${x.orders}</td><td>${x.used!=null?`${x.used}/${x.eligible}（成熟批次）`:'待接入票种核验'}</td></tr>`).join('')}</tbody></table></div></section></div><div class="stack"><section class="card"><div class="card-head"><h2>近 14 天趋势</h2>${pill('模拟趋势','mock')}</div>${trendSvg()}<div class="chart-labels"><span>6月15日</span><span>6月21日</span><span>6月28日</span></div></section><section class="card"><h2>这些数据现在能回答什么</h2><div class="reason">${pill('已能看','green')}<p>销售、核验、退款、园内收款和渠道变化。</p></div><div class="reason">${pill('还要补','amber')}<p>不同日期的价格政策、项目开放、投放链路和游客反馈，才能判断原因。</p></div><div class="reason">${pill('不能直接算','red')}<p>门票收款不等于净收入；园内流水也不等于景区利润。</p></div></section></div></div>`}
function issues(){return header('哪里出了问题','每条先给线索，再列要查什么。不能仅凭涨跌断定原因。',btn('去看改进方案','go','ideas','primary'))+`<section class="card">${issueRows()}</section>`}
function ideas(){let order=['content','ads','partner','team','onsite','product','revisit','package'];let ids=Object.keys(DEMO.plans).filter(id=>id!=='show'||state.site==='C').sort((a,b)=>(order.includes(a)?order.indexOf(a):100)-(order.includes(b)?order.indexOf(b):100));let filtered=state.planFilter==='all'?ids:ids.filter(id=>DEMO.plans[id].category===state.planFilter);let cats=[...new Set(ids.map(id=>DEMO.plans[id].category))];return header('AI 出主意','方案写清依据、适用条件、谁来做、怎么算有效，以及什么情况该停。',btn('查看待决策问题','go','issues'))+`<div class="guide"><span><span class="number">1</span>看依据</span> → <span><span class="number">2</span>选做法</span> → <span><span class="number">3</span>交给负责人</span> → <span><span class="number">4</span>回来看效果</span></div><div class="tabs"><button data-action="filter" data-id="all" class="${state.planFilter==='all'?'active':''}">全部方案</button>${cats.map(c=>`<button data-action="filter" data-id="${c}" class="${state.planFilter===c?'active':''}">${c}</button>`).join('')}</div><div class="grid-3">${filtered.map(id=>{let p=DEMO.plans[id];return `<section class="card plan-card">${pill(p.category,id==='listing'?'red':'green')}<h2>${p.name}</h2><p>${p.why}</p><div class="evidence"><div class="module-label">目前依据 · 模拟</div><p>${p.basis}</p></div>${growthCardSnippet(id)}<div class="actions">${btn('查看怎么做','plan',id,'primary')}</div><div class="foot">建议观察 ${p.days} 天 · ${state.decisions[id]?'已选过此方案':'由经营者决定是否采用'}</div></section>`}).join('')}</div>`}
function taskRows(group){return group.map(({t,i})=>`<div class="execution-task"><div>${pill(t.status,t.status==='已验收'?'green':t.status==='需补充'?'red':'amber')}${t.demo?pill('模拟执行单','mock'):''}<strong>${esc(t.title)}</strong><p>${esc(t.owner)} · ${esc(t.due)}${t.dueDate?' · 目标 '+esc(t.dueDate):''}</p><div class="task-progress"><span style="width:${t.checklist?.length?doneCount(t)/t.checklist.length*100:0}%"></span></div><div class="progress-label">已完成 ${doneCount(t)} / ${t.checklist?.length||0} 个具体步骤 · 需回传：${esc(t.proof||'执行记录')}</div></div>${btn('查看执行事项','task',String(i))}</div>`).join('')}
function tasks(){let groups=new Map;state.tasks.forEach((t,i)=>{let key=t.round||t.plan||'一句话安排';if(!groups.has(key))groups.set(key,[]);groups.get(key).push({t,i})});return header('事情进展','每个方案拆成具体事项。负责人逐项完成、回传材料，经营者再验收。',btn('去选方案','go','ideas','primary'))+`<div class="stat-line"><div class="status-count"><strong>${state.tasks.filter(t=>['待确认','待接单'].includes(t.status)).length}</strong>待确认</div><div class="status-count"><strong>${state.tasks.filter(t=>['处理中','需补充','遇到困难'].includes(t.status)).length}</strong>处理中／遇到困难</div><div class="status-count"><strong>${state.tasks.filter(t=>['待验收','待班组复核','待管理层验收'].includes(t.status)).length}</strong>待复核／验收</div><div class="status-count"><strong>${state.tasks.filter(t=>t.status==='已验收').length}</strong>已验收</div></div>${[...groups.entries()].reverse().map(([key,group])=>{let plan=group[0].t.plan,p=DEMO.plans[plan],finished=group.filter(x=>x.t.status==='已验收').length;return `<section class="card execution-plan"><div class="execution-plan-head"><div><div class="module-label">${group[0].t.demo?'示例执行单':'已选择的方案'}</div><h2>${p?.name||'经营者一句话安排'}</h2><p>${finished}/${group.length} 项已验收 · ${group.reduce((n,x)=>n+doneCount(x.t),0)}/${group.reduce((n,x)=>n+(x.t.checklist?.length||0),0)} 个步骤已完成</p></div>${pill(group[0].t.demo?'模拟演示':'本地任务','mock')}</div>${growthRoundSummary(key)}${commandGroupSummary(key)}<div class="execution-list">${taskRows(group)}</div></section>`}).join('')}<div class="note">任务与反馈只保存在本浏览器，未发送给真实员工；示例执行单可直接点开体验。</div>`}
function review(){let rounds=Object.entries(state.rounds).reverse(),legacy=Object.keys(state.decisions).filter(id=>!rounds.some(([,r])=>r.plan===id));let entries=rounds.map(([key,r])=>{let work=state.tasks.filter(t=>t.round===key),ready=work.length&&work.every(t=>t.status==='已验收'),done=work.filter(t=>t.status==='已验收').length;return `<div class="mini-row"><div><strong>${esc(DEMO.plans[r.plan]?.name||'经营方案')}</strong><div class="tiny">${esc(r.start)} 开始 · ${done}/${work.length} 项已验收${ready?'，可以记录效果':'，先完成执行和验收'}</div></div>${ready?btn('填写实际结果','growth-review',key):pill('待执行','amber')}</div>`}).join('')+legacy.map(id=>{let work=state.tasks.filter(t=>t.plan===id&&!t.demo),ready=work.length&&work.every(t=>t.status==='已验收');return `<div class="mini-row"><div><strong>${esc(DEMO.plans[id]?.name||'原有方案')}</strong><div class="tiny">${work.filter(t=>t.status==='已验收').length}/${work.length} 项已验收</div></div>${ready?btn('填写实际结果','review-form',id):pill('待执行','amber')}</div>`}).join('');return header('改完有没有用','按每轮实际到访、费用和可比条件复盘。',btn('去选一个方案','go','ideas','primary'))+`<section class="card"><div class="card-head"><h2>每一轮方案的执行和复盘</h2>${pill('本浏览器保存')}</div>${entries||'<div class="empty">先在“AI 出主意”里选择一个办法并安排执行。</div>'}</section><section class="card section-gap"><div class="card-head"><h2>我的改进记录</h2></div>${state.reviews.length?state.reviews.map((r,i)=>`<div class="mini-row"><div><strong>${esc(r.plan)}</strong><div class="tiny">${r.actual?`记录数量：${fmt(r.actual.n)} · 实际费用：¥${fmt(r.actual.expense)} · ${r.basis==='comparison'?'有可比估算':'增量待核实'}`:`原来：${esc(r.baseline)} · 后来：${esc(r.after)} · 费用：¥${fmt(r.cost)}`} · ${esc(r.date)}</div></div>${btn('看结论','review-detail',String(i))}</div>`).join(''):'<div class="empty">还没有复盘记录。执行后再记录实际结果。</div>'}</section><div class="note amber">同星期、天气、闭园、促销、可售状态与退款都会影响对比；有来源订单也不等于都是新增。</div>`}
function voice(){return header('客人怎么说','先把现场听到的事记下来，再结合订单和核验核查。少量反馈不代表全部游客。',btn('把反馈变成建议','plan','product','primary'))+`<div class="grid-3">${DEMO.feedback.map(f=>`<section class="card"><div class="card-head">${pill('模拟反馈','mock')}<span class="tiny">${f.date}</span></div><h2>${f.topic}</h2><p class="muted">${f.source} · ${f.count} 条</p><div class="note amber">这只是问题线索；需要核对完整样本、发生时间和对应服务状态。</div></section>`).join('')}</div><section class="card section-gap"><h2>正式接入后怎样收集</h2><div class="stat-line"><div>① 现场人员选问题类别与发生时间</div><div>② 记录来源与匿名数量</div><div>③ 关联营业和订单数据验证</div></div><div class="note">只记录必要的匿名信息。来自平台评价的游客只代表该平台的评论群体。</div></section>`}
function market(){return header('同行和新机会','用公开变化寻找灵感，再检查本景区是否有条件做。公开热度不等于销量。',btn('看小项目评估','plan','project','primary'))+`<div class="grid-3">${DEMO.competitors.map(x=>`<section class="card">${pill('模拟公开线索','mock')}<h2 style="margin:12px 0">${x.name}</h2><p>${x.seen}</p><div class="note">${x.question}</div><span class="tiny">模拟收集日期：${x.date}。不是实时监测。</span></section>`).join('')}<section class="card">${pill('适用条件','amber')}<h2 style="margin:12px 0">上新前先查五件事</h2><p>客群真需要吗？季节合适吗？场地和安全允许吗？人员够吗？投入能收回吗？</p>${btn('打开评估方案','plan','project','primary')}</section></div>`}

function taskUpdate(index,status){let t=state.tasks[Number(index)];if(!t)return;let owner=$('#task-owner')?.value.trim(),dueDate=$('#task-due')?.value,feedback=$('#task-feedback')?.value.trim()||'',evidence=$('#task-evidence')?.value.trim()||'',acceptanceNote=$('#task-acceptance')?.value.trim()||'';if(!owner||!dueDate){toast('请先确定实际负责人和完成日期');return}t.owner=owner;t.dueDate=dueDate;t.feedback=feedback;t.evidence=evidence;t.acceptanceNote=acceptanceNote;if(status==='待验收'&&(!t.done.every(Boolean)||!feedback||!evidence)){save();toast('先完成全部步骤，并填写反馈与回传材料');return}if(status==='已验收'&&(!t.done.every(Boolean)||!feedback||!evidence)){toast('步骤、反馈和回传材料不完整，暂不能验收');return}if(['已验收','需补充'].includes(status)&&(t.status!=='待验收'||!acceptanceNote)){toast('请在待验收状态写明验收意见');return}t.status=status||(t.status==='待确认'?'处理中':t.status);save();close();toast(status==='已验收'?'已验收：本地演示记录已更新':'执行进度已保存');render()}

document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;if(a==='go'){close();go(id)}else if(a==='metric')metricDetail(id);else if(a==='issue')issueDetail(id);else if(a==='plan')planDetail(id);else if(a==='choose')choose(id);else if(a==='task')taskDetail(id);else if(a==='task-check'){let t=state.tasks[Number(id)],step=Number(b.dataset.step);if(t&&step>=0&&step<t.done.length&&t.status!=='已验收'){t.done[step]=b.checked;b.closest('.check-item').classList.toggle('checked',b.checked);$('#drawer-body .detail-stat:last-child strong').textContent=`${doneCount(t)}/${t.checklist.length}`;save()}}else if(a==='task-update')taskUpdate(id,b.dataset.status);else if(a==='filter'){state.planFilter=id;render()}else if(a==='quick-command')draftCommand($('#home-command')?.value);else if(a==='draft-command')draftCommand($('#command-text')?.value);else if(a==='save-command')saveCommand(b.dataset.text,b.dataset.visit==='1');else if(a==='round-detail')growthRoundDetail(id);else if(a==='growth-review'){let r=state.rounds[id];if(r)growthReviewForm(r.plan,id)}else if(a==='review-detail')reviewDetail(id);else if(a==='review-form')openReviewForm(id);else if(a==='pilot')window.open('pilot.html','_blank','noopener')});

function growthResult(id,x){let m=GROWTH[id],r=growthCalculation(x);if(!r.valid)return '<div class="growth-warning">请把每项数字填写完整；人数／笔数及容量须为非负整数。</div>';let warnings=[];if(r.overBudget)warnings.push('预计总费用超过本轮预算上限。');if(r.overCapacity)warnings.push('预计新增量超过接待或服务上限。');if(r.unreachable)warnings.push('达到回本所需的新增量超过当前容量。');if(r.unit<=0)warnings.push('每笔实收不足以覆盖每笔成本和佣金，按当前假设无法靠增加销量回本。');if(r.contribution<0)warnings.push('这组假设下，增量贡献还不足以覆盖费用。');return `<div class="growth-result"><div class="tiny">模拟估算 · 非收入承诺</div><strong class="${r.contribution<0?'negative':''}">${r.contribution<0?'−':''}¥${fmt(Math.abs(r.contribution))}</strong><p>预计增量经营贡献 = ${fmt(x.n)} × (¥${fmt(x.price)} − ¥${fmt(x.cost)} − ¥${fmt(x.commission)}) − ¥${fmt(x.expense)} − ¥${fmt(x.loss)}</p><p>每${esc(m.unit.replace(/^真正新增|^新增/,''))}贡献 ¥${fmt(r.unit)}；覆盖费用与替代损失至少需要 ${r.breakeven==null?'无法回本':fmt(r.breakeven)+' '+esc(m.unit)}。</p><p>这里是扣相关变动成本后的试算，未分摊全部固定成本及税费，不等于净利润；多方案可能争夺同一批游客，不能直接相加。</p>${warnings.length?`<div class="growth-warning">${warnings.map(esc).join(' ')}</div>`:''}</div>`}
function readGrowthDraft(id){let g=GROWTH[id],x={};for(let k of ['n','price','cost','commission','expense','loss','capacity','budget','days']){let el=document.querySelector(`[data-growth-field="${k}"][data-growth-plan="${id}"]`);x[k]=el&&el.value!==''?Number(el.value):NaN}x.owner=(document.querySelector('[data-growth-owner]')?.value||'').trim();x.start=document.querySelector('[data-growth-start]')?.value||'';return x}
function growthPanel(id){let m=GROWTH[id],x=growthDraft(id);return `<div class="growth-hero"><div class="module-label">这笔钱准备怎么赚 · 方案演示</div><p>${esc(m.opportunity)}</p></div><div class="growth-section"><h3>这个判断靠什么</h3><div class="evidence-list"><div class="evidence-item"><strong>已经看到的线索 · 模拟</strong><small>${esc(m.facts)}</small></div><div class="evidence-item"><strong>做决定前还要核对</strong><small>${esc(m.missing)}</small></div></div></div><div class="growth-section"><h3>卖给谁、卖什么</h3><p class="small"><strong>适合客群：</strong>${esc(m.audience)}</p><p class="small" style="margin-top:8px"><strong>卖法：</strong>${esc(m.offer)}</p><div class="growth-example" style="margin-top:12px"><strong>拿去改的执行样例</strong><br>${esc(m.material)}</div></div><div class="growth-section"><h3>试行节奏和效果怎么核对</h3><p class="small">${esc(m.rhythm)}</p><div class="note"><strong>怎么分清有没有新增：</strong>${esc(m.track)}</div></div><div class="growth-section"><h3>先算一笔账 <span class="pill mock">数字均可修改 · 模拟假设</span></h3><p class="tiny">把每笔实收、每笔成本、一次性总费用分开。佣金按单计入，不要再放进总费用。</p><div class="growth-fields" style="margin-top:12px">${growthField(id,'n',m.unit,x.n,'只填预计真正新增；没有对照时只是待验证假设')}${growthField(id,'price',m.priceLabel+'（元）',x.price,'每笔或每人的净实收，先扣相应退款','0.01')}${growthField(id,'cost','每笔新增成本（元）',x.cost,'接待、商品或服务等随新增量发生的成本','0.01')}${growthField(id,'commission','每笔佣金（元）',x.commission,'本项按单计入，不重复算到总费用','0.01')}${growthField(id,'expense','本轮总费用（元）',x.expense,'如素材制作、投放、物料，整个方案共用一份','0.01')}${growthField(id,'loss','替代损失（元）',x.loss,'原价客户转到优惠或其他渠道造成的少赚总额','0.01')}${growthField(id,'capacity','本轮新增量上限',x.capacity,'确认实际可接待或可服务的上限')}${growthField(id,'budget','预算上限（元）',x.budget,'整个方案共用的总上限，不是每项任务各一份','0.01')}${growthField(id,'days','试行天数',x.days,'试行多少天后复盘')}</div><div id="growth-result">${growthResult(id,x)}</div><div class="form-grid"><label class="field">本轮总负责人<input data-growth-owner value="${esc(x.owner)}" maxlength="40" placeholder="填写负责岗位或姓名"></label><label class="field">开始日期<input data-growth-start type="date" value="${esc(x.start)}"></label></div><div class="note amber"><strong>先停下来的情况：</strong>${esc(m.stop)}</div><div class="growth-source">方法参考：${esc(m.source)} <a href="${esc(m.sourceUrl)}" target="_blank" rel="noopener noreferrer">查看原始资料 ↗</a>。资料仅支持思路，不证明本景区效果。</div></div>`}
function growthRoundSummary(round){let r=state.rounds[round];if(!r)return '';let z=growthCalculation(r);return `<div class="round-summary"><strong>本轮试行单</strong> · 总负责人 ${esc(r.owner)} · ${esc(r.start)} 开始 / ${fmt(r.days)} 天 · 预算上限 ¥${fmt(r.budget)}（各任务共用）<br>模拟假设：${fmt(r.n)} ${esc(GROWTH[r.plan]?.unit||'新增量')} · 预计总费用 ¥${fmt(r.expense)} · 估算贡献 ${z.valid?'¥'+fmt(z.contribution):'待核算'} ${btn('看试行账','round-detail',round,'link')}</div>`}
function growthRoundDetail(round){let r=state.rounds[round],m=r&&GROWTH[r.plan];if(!r||!m)return;drawer('本轮试行账：'+DEMO.plans[r.plan].name,`${pill('选择方案时保存的模拟假设','mock')}<div class="note">总负责人：${esc(r.owner)}；${esc(r.start)} 开始，试行 ${fmt(r.days)} 天。总预算上限 ¥${fmt(r.budget)}，所有任务共用。</div>${growthResult(r.plan,r)}<div class="block"><h3>执行重点</h3><p>${esc(m.rhythm)}</p></div><div class="block"><h3>怎么判断有没有新增</h3><p>${esc(m.track)}</p></div><div class="note amber">${esc(m.stop)}</div>`)}
function growthReviewForm(id,round){let plan=DEMO.plans[id],m=GROWTH[id],r=state.rounds[round];if(!plan||!m||!r)return;drawer(`复盘：${plan.name}`,`<form id="growth-review-form"><input type="hidden" name="planId" value="${esc(id)}"><input type="hidden" name="round" value="${esc(round)}"><div class="note">试行前假设：${fmt(r.n)} ${esc(m.unit)}、总费用 ¥${fmt(r.expense)}、预算上限 ¥${fmt(r.budget)}。请按实际结果填写，不自动归因。</div><label class="field">你怎么判断新增的？<select name="basis" required><option value="">请选择</option><option value="comparison">有相近时段或未投放对象作对照，估算出新增</option><option value="channel">只有来源渠道订单，无法判断真正新增</option><option value="none">记录不完整，还无法判断</option></select></label><div class="growth-fields"><label class="field">对照期有效数量<input name="before" type="number" min="0" step="1" placeholder="有对照时填写"><span class="help">选择相同口径与可比时段</span></label><label class="field">试行期有效数量<input name="after" type="number" min="0" step="1" placeholder="有对照时填写"><span class="help">对照数量不自动等于真正新增</span></label></div><div class="growth-fields">${[['n','增量估计或来源数量（人次／笔）','只填可说明来源的数量','1'],['price',m.priceLabel+'（元）','净实收，先排除对应退款','0.01'],['cost','每笔实际新增成本（元）','接待与商品等实际成本','0.01'],['commission','每笔实际佣金（元）','按单扣除，不与总费用重复','0.01'],['expense','本轮实际总费用（元）','媒体、物料、制作等整轮总额','0.01'],['loss','替代损失估计（元）','原价或原渠道被转移少赚的金额','0.01']].map(([k,label,help,step])=>`<label class="field">${esc(label)}<input name="${k}" type="number" min="0" max="1000000000" step="${step}" required><span class="help">${esc(help)}</span></label>`).join('')}</div><label class="field">对照条件与数据来源<textarea name="conditions" required placeholder="例如同星期、天气、开放情况、订单批次和来源记录"></textarea></label><label class="field">服务和投诉情况<textarea name="service" required placeholder="填写投诉、排队、接待能力等实际情况；没有也请注明"></textarea></label><label class="inline-check"><input name="adverse" type="checkbox">服务明显变差、超出接待能力或出现安全问题</label><div class="note">渠道关联订单不等于新增；没有可比依据时只保存原始记录，不计算实际增量贡献。</div><button class="btn primary" type="submit">保存复盘</button></form>`)}
function saveGrowthReview(form){let f=new FormData(form),id=String(f.get('planId')),round=String(f.get('round')),r=state.rounds[round],m=GROWTH[id];if(!r||!m||r.plan!==id)return;let actual={};for(let k of ['n','price','cost','commission','expense','loss'])actual[k]=Number(f.get(k));actual.capacity=r.capacity;actual.budget=r.budget;let calc=growthCalculation(actual);if(!calc.valid){toast('请检查实际金额和数量，数量必须为整数');return}let basis=String(f.get('basis')||''),conditions=String(f.get('conditions')||'').trim(),service=String(f.get('service')||'').trim(),beforeRaw=String(f.get('before')||'').trim(),afterRaw=String(f.get('after')||'').trim(),before=beforeRaw===''?null:Number(beforeRaw),after=afterRaw===''?null:Number(afterRaw);if(!['comparison','channel','none'].includes(basis)||!conditions||!service){toast('请填写对照条件、来源与服务情况');return}if(basis==='comparison'&&(!Number.isInteger(before)||!Number.isInteger(after)||before<0||after<0)){toast('有可比对照时，请填写两期的有效数量');return}state.reviews.push({plan:DEMO.plans[id].name,planId:id,round,actual,basis,before,after,conditions,service,adverse:f.has('adverse'),date:new Date().toLocaleDateString('zh-CN')});save();close();toast('复盘已保存，结论保留数据依据');go('review')}
function growthReviewDetail(r){let x=r.actual,z=growthCalculation(x),budget=state.rounds[r.round]?.budget,flags=[];if(r.adverse)flags.push('服务或安全出现问题，先暂停扩大。');if(x.expense>budget)flags.push('实际费用超过预算上限，先核对再决定是否继续。');if(x.n>x.capacity)flags.push('实际数量超出预设容量，先核实服务影响。');let conclusion=r.basis==='comparison'?`按填写的可比估算，本轮增量经营贡献约 ¥${fmt(z.contribution)}；对照是否充分仍需经营者核实，不能自动证明因果。`:r.basis==='channel'?'当前只能确认渠道关联，不能把来源订单当真正新增；暂不计算实际增量贡献。':'记录不完整，暂不能判断实际新增或贡献。';drawer(r.plan,`${pill('本轮复盘','green')}<div class="evidence-item"><strong>本次判断</strong><small>${esc(conclusion)}</small></div><div class="detail-grid"><div class="detail-stat">记录数量<strong>${fmt(x.n)}</strong>人次／笔</div><div class="detail-stat">实际总费用<strong>¥${fmt(x.expense)}</strong></div><div class="detail-stat">替代损失估计<strong>¥${fmt(x.loss)}</strong></div></div><div class="block"><h3>对照与数据来源</h3>${r.basis==='comparison'?`<p>对照期有效数量 ${fmt(r.before)}；试行期有效数量 ${fmt(r.after)}。新增数量 ${fmt(x.n)} 是填写人的估算，不是系统自动认定。</p>`:''}<p>${esc(r.conditions)}</p></div><div class="block"><h3>服务情况</h3><p>${esc(r.service)}</p></div>${flags.length?`<div class="note red">${flags.map(esc).join(' ')}</div>`:''}<div class="note">金额为记录结果，未分摊全部固定成本和税费。多个方案可能触达同一批游客，不能直接相加。</div>`)}
document.addEventListener('input',e=>{let el=e.target,id=el.dataset.growthPlan;if(!id||!GROWTH[id])return;let x=readGrowthDraft(id);state.planDrafts[id]=x;save();let out=document.querySelector('#growth-result');if(out)out.innerHTML=growthResult(id,x)});
document.addEventListener('change',e=>{if(!e.target.matches('[data-growth-owner],[data-growth-start]'))return;let el=document.querySelector('[data-growth-plan]');if(el){state.planDrafts[el.dataset.growthPlan]=readGrowthDraft(el.dataset.growthPlan);save()}});
document.addEventListener('submit',e=>{if(e.target.id==='growth-review-form'){e.preventDefault();saveGrowthReview(e.target)}});
</script></body></html>
