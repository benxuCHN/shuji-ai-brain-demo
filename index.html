    {owner:'经营者',title:'核对内容到底带来多少有效到访',due:'第 14 天',checklist:['核对来源支付、退款和实际核验','记录素材与投放等新增费用','和相近星期、天气对比'],proof:'有效到访与费用复盘表',acceptance:'以有效到访和新增贡献判断，不用播放量代替收入。'}
  ],
  partner:[
    {owner:'渠道负责人',title:'挑 3 个渠道逐个谈清楚',due:'第 3 天',checklist:['先查现有渠道是否缺货或展示错误','问清客群、佣金、回款周期和退改责任','确认景区接待余量和团体容量'],proof:'渠道条件对比表',acceptance:'每个候选渠道的价格、费用和责任写清。'},
    {owner:'票务负责人',title:'给试点渠道单独标记客源',due:'第 5 天',checklist:['设置独立来源码或订单标记','每日记售出、退款、核验','原有渠道保留作观察'],proof:'试点渠道匿名订单日报',acceptance:'能辨别新增游客和原渠道转单。'},
    {owner:'财务负责人',title:'扣完佣金再决定续不续',due:'第 14 天',checklist:['核对实际回款与结算差异','扣佣金、折扣和新增服务成本','记录延迟回款或投诉'],proof:'渠道贡献与回款复盘',acceptance:'只有净贡献为正且回款正常才建议扩大。'}
  ],

    {owner:'财务负责人',title:'两周后算景区实际多得多少',due:'第 14 天',checklist:['比较相近营业日的点位成交','自营扣进货与履约成本，商户按分成算','核对浪费、投诉和新增费用'],proof:'点位净贡献对照表',acceptance:'实际贡献可核算，不能只用商户流水增长做结论。'}

  ],

    {owner:'营销执行',title:'只试一个场次的提醒与导引',due:'第 2—7 天',checklist:['确认预约入口和退改说明可用','在入口和园内更新场次指引','记录提醒触达与实际核验'],proof:'指引更新和场次核验表',acceptance:'不新增未验证需求的场次，游客能看懂预约方式。'},

</script><script>const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>n==null?'—':Number(n).toLocaleString('zh-CN',{maximumFractionDigits:1}),pct=(a,b)=>b>0?(a-b)/b:null;
const nav=[['home','⌂','经营首页'],['board','▥','数据看板'],['issues','◇','哪里出了问题'],['ideas','✦','AI 出主意'],['tasks','☑','事情进展'],['review','◴','改完有没有用'],['voice','♧','客人怎么说'],['market','◎','同行和新机会'],['staff','♙','员工在岗'],['command','↗','一句话安排'],['sources','▤','数据从哪来']];
const saved=()=>{try{return JSON.parse(localStorage.getItem('shuji_v8_state')||'{}')}catch{return {}}};let persisted=saved();let state={site:'A',view:location.hash.slice(1)||'home',period:'day',planFilter:'all',mode:new URLSearchParams(location.search).get('pilot')==='1'?'pilot':'full',tasks:Array.isArray(persisted.tasks)?persisted.tasks:[],commands:Array.isArray(persisted.commands)?persisted.commands:[],reviews:Array.isArray(persisted.reviews)?persisted.reviews:[],decisions:persisted.decisions||{},uploaded:null};
const siteName=()=>`景区 ${state.site}`,save=()=>localStorage.setItem('shuji_v8_state',JSON.stringify({tasks:state.tasks,commands:state.commands,reviews:state.reviews,decisions:state.decisions}));
const metric=k=>{let m=DEMO.metrics[k],r=state.uploaded?.metrics?.[k];return r?{...m,...r}:m};
const change=(k,now,prev)=>{let n=pct(now,prev);return `<button class="change ${n==null?'':n>=0?'up':'down'}" data-action="metric" data-id="${k}" title="查看这项变化的原因与建议">${n==null?'缺少可比数据':`${n>=0?'↑':'↓'} ${Math.abs(n*100).toFixed(1)}%`}</button>`};
const pill=(text,kind='')=>`<span class="pill ${kind}">${esc(text)}</span>`,btn=(name,action,id='',cls='')=>`<button class="btn ${cls}" data-action="${action}" data-id="${id}">${name}</button>`;
const sourceTag=()=>state.uploaded?'上传表格':'模拟数据';
const localDate=(offset=0)=>{let d=new Date();d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function dueOffset(label){if(/当天|发现后|确认后|修复后|后\s*\d+\s*(分钟|小时)/.test(label))return 0;let m=String(label).match(/第\s*(\d+)/);return m?Math.max(0,Number(m[1])-1):1}
function makeTask(plan,id,round,demo=false){let x=EXECUTION[plan][id];return {title:x.title,owner:x.owner,status:'待确认',due:x.due,dueDate:localDate(dueOffset(x.due)),plan,round,feedback:'',evidence:'',acceptanceNote:'',checklist:[...x.checklist],done:x.checklist.map(()=>false),proof:x.proof,acceptance:x.acceptance,demo}}
function hydrateTasks(){for(let t of state.tasks){if(!t.checklist){let list=EXECUTION[t.plan]||[],old=DEMO.plans[t.plan]?.steps||[],i=old.findIndex(x=>x[1]===t.title),x=list[Math.max(0,i)];t.checklist=x?[...x.checklist]:['确认这件事的负责人和完成时间','记录具体做了什么','向经营者回报结果'];t.done=t.checklist.map(()=>t.status==='已验收');t.proof=x?.proof||'执行记录或可核对的结果';t.acceptance=x?.acceptance||'负责人回报，经营者确认结果';t.evidence=t.evidence||'';t.acceptanceNote=t.acceptanceNote||'';t.dueDate=t.dueDate||localDate(1);t.round=t.round||`旧版任务-${t.plan||'安排'}`}}if(!state.tasks.length){let round='示例执行单-售票入口';state.tasks=EXECUTION.listing.map((_,i)=>makeTask('listing',i,round,true));state.tasks[0].status='处理中';state.tasks[0].done[0]=true}save()}
const doneCount=t=>(t.done||[]).filter(Boolean).length;
function toast(s){let x=$('#toast');x.textContent=s;x.classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>x.classList.remove('visible'),3200)}
function drawer(title,body){$('#drawer-title').textContent=title;$('#drawer-body').innerHTML=body;if(!$('#drawer').open)$('#drawer').showModal()}function close(){if($('#drawer').open)$('#drawer').close()}
function go(v){state.view=nav.some(x=>x[0]===v)?v:'home';location.hash=state.view;render();window.scrollTo(0,0);document.body.classList.remove('nav-open')}
function header(title,sub,buttons=''){return `<div class="page-head"><div><div class="eyebrow">${siteName()} · ${state.mode==='pilot'?'试点版':'完整产品'} · ${state.uploaded?'表格数据':'模拟数据'}</div><h1>${title}</h1><p>${sub}</p></div><div class="head-actions">${buttons}</div></div>`}
function kpiCards(){return `<div class="kpi-grid">${Object.entries(DEMO.metrics).map(([k,m])=>{let x=metric(k);return `<div class="card kpi"><div class="kpi-name">${m.name}</div><div class="kpi-value">${fmt(x.now)}<span class="kpi-unit">${m.unit}</span></div>${change(k,x.now,x.prev)}<div class="kpi-note">${state.uploaded&&x.source==='上传表格'?'来自本次上传':'演示数据'} · 对比同星期</div></div>`}).join('')}</div>`}
function issueRows(limit=99){return DEMO.issues.slice(0,limit).map(i=>`<div class="issue-row"><div class="issue-icon ${i.level}">${i.level==='red'?'!':'↗'}</div><div><div class="inline-meta">${pill(i.level==='red'?'先处理':'要关注',i.level)}${pill('模拟线索','mock')}<span>${i.owner}</span></div><h3>${i.title}</h3><p>${i.signal}</p><div class="tiny">依据：${i.source}</div></div>${btn('看分析和改法 →','issue',i.id)}</div>`).join('')}
function trendSvg(){let v=DEMO.trend,lo=Math.min(...v)-1000,hi=Math.max(...v)+1000;let points=v.map((x,i)=>`${i*500/(v.length-1)},${112-(x-lo)/(hi-lo)*100}`).join(' ');return `<svg class="spark" viewBox="0 0 500 120" role="img" aria-label="模拟的14天门票收款趋势"><defs><linearGradient id="fade" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#83c5b6" stop-opacity=".3"/><stop offset="1" stop-color="#83c5b6" stop-opacity="0"/></linearGradient></defs><polygon points="0,120 ${points} 500,120" fill="url(#fade)"/><polyline points="${points}" fill="none" stroke="#388e84" stroke-width="3" stroke-linecap="round"/><circle cx="500" cy="${112-(v.at(-1)-lo)/(hi-lo)*100}" r="5" fill="#cb4454"/></svg>`}
function home(){let tasks=state.tasks.filter(t=>t.status!=='已验收');return header('今天先看这几件事','先看数据，再处理需要决策的问题。示例日期：2026年6月28日。',btn('查看完整看板','go','board','primary'))+`<div class="summary-strip"><strong>AI 今日提醒：先核对日报和售票入口，再决定是否扩大投放。</strong><p>门票收款较可比日下降 20%，但园内消费增长 16.4%；原因仍需核查。${state.uploaded?'经营数字来自本次上传，问题线索仍为模拟。':'以下经营数字、问题和任务均为模拟。'}</p></div>${kpiCards()}<div class="two-col"><div class="stack"><section class="card"><div class="card-head"><h2>需要你决定的问题</h2>${btn('查看全部','go','issues','link')}</div>${issueRows(4)}</section><section class="card"><div class="card-head"><h2>最近 14 天门票收款</h2>${pill('模拟趋势','mock')}</div>${trendSvg()}<div class="chart-labels"><span>6月15日</span><span>6月21日</span><span>6月28日</span></div><div class="note">同星期比较只是一条线索。遇到闭园、天气、节假日变化，应先核对是否可比。</div></section></div><div class="stack"><section class="card"><div class="card-head"><h2>督办事项</h2>${btn('去看进展','go','tasks','link')}</div><div class="mini-row"><span>待处理／进行中</span><strong>${tasks.length} 件</strong></div>${tasks.slice(0,3).map(t=>`<div class="mini-row"><span>${esc(t.title)}</span>${pill(t.status,t.status==='已验收'?'green':'amber')}</div>`).join('')}</section><section class="card"><div class="card-head"><h2>员工在岗</h2>${btn('看各岗位','go','staff','link')}</div><div class="roster-summary"><span class="roster-number">61<small> / 64 人</small></span><span class="tiny">请假 2 人 · 未确认 1 人<br>先核实关键岗位有无空缺</span></div><div class="task-progress"><span style="width:95.3%"></span></div></section><section class="card"><div class="card-head"><h2>一句话安排工作</h2>${btn('完整流程','go','command','link')}</div><p class="tiny">说一件事，拆成负责人、动作、反馈和验收。</p><div class="quick-command"><input id="home-command" placeholder="例如：明天有检查，准备好接待和安全巡查"><button class="btn primary" data-action="quick-command">生成安排</button></div></section></div></div>`}
function board(){let c=DEMO.channels,p=DEMO.products;return header('数据看板','钱从哪里来，哪些产品在变化。点击涨跌数字看分析；各项业务收款不可随意相加。',btn('上传景区表格','go','sources','primary'))+kpiCards()+`<div class="two-col"><div class="stack"><section class="card"><div class="card-head"><h2>各渠道卖得怎么样</h2>${pill(state.uploaded?'渠道仍为模拟':'模拟数据','mock')}</div><div class="table-wrap"><table><thead><tr><th>渠道</th><th>门票收款</th><th>同星期变化</th><th>订单</th><th>退款发生额</th><th>渠道／投放费用</th></tr></thead><tbody>${c.map(x=>`<tr><td>${x.name}</td><td>¥${fmt(x.now)}</td><td>${change('paid',x.now,x.prev)}</td><td>${x.orders}</td><td>¥${fmt(x.refund)}</td><td>¥${fmt(x.fee)}</td></tr>`).join('')}</tbody></table></div><div class="note">本示例四个渠道门票收款合计 ¥38,400。费用性质各不相同，须按合同核对，不能直接用收款减费用当利润。</div></section><section class="card"><div class="card-head"><h2>卖的是什么票</h2>${pill('模拟数据','mock')}</div><div class="table-wrap"><table><thead><tr><th>票种</th><th>门票收款</th><th>同星期变化</th><th>订单</th><th>核验说明</th></tr></thead><tbody>${p.map(x=>`<tr><td>${x.name}</td><td>¥${fmt(x.now)}</td><td>${change('paid',x.now,x.prev)}</td><td>${x.orders}</td><td>${x.used!=null?`${x.used}/${x.eligible}（成熟批次）`:'待接入票种核验'}</td></tr>`).join('')}</tbody></table></div></section></div><div class="stack"><section class="card"><div class="card-head"><h2>近 14 天趋势</h2>${pill('模拟趋势','mock')}</div>${trendSvg()}<div class="chart-labels"><span>6月15日</span><span>6月21日</span><span>6月28日</span></div></section><section class="card"><h2>这些数据现在能回答什么</h2><div class="reason">${pill('已能看','green')}<p>销售、核验、退款、园内收款和渠道变化。</p></div><div class="reason">${pill('还要补','amber')}<p>不同日期的价格政策、项目开放、投放链路和游客反馈，才能判断原因。</p></div><div class="reason">${pill('不能直接算','red')}<p>门票收款不等于净收入；园内流水也不等于景区利润。</p></div></section></div></div>`}
function issues(){return header('哪里出了问题','每条先给线索，再列要查什么。不能仅凭涨跌断定原因。',btn('去看改进方案','go','ideas','primary'))+`<section class="card">${issueRows()}</section>`}
function ideas(){let ids=Object.keys(DEMO.plans).filter(id=>id!=='show'||state.site==='C');let filtered=state.planFilter==='all'?ids:ids.filter(id=>DEMO.plans[id].category===state.planFilter);let cats=[...new Set(ids.map(id=>DEMO.plans[id].category))];return header('AI 出主意','方案写清依据、适用条件、谁来做、怎么算有效，以及什么情况该停。',btn('查看待决策问题','go','issues'))+`<div class="guide"><span><span class="number">1</span>看依据</span> → <span><span class="number">2</span>选做法</span> → <span><span class="number">3</span>交给负责人</span> → <span><span class="number">4</span>回来看效果</span></div><div class="tabs"><button data-action="filter" data-id="all" class="${state.planFilter==='all'?'active':''}">全部方案</button>${cats.map(c=>`<button data-action="filter" data-id="${c}" class="${state.planFilter===c?'active':''}">${c}</button>`).join('')}</div><div class="grid-3">${filtered.map(id=>{let p=DEMO.plans[id];return `<section class="card plan-card">${pill(p.category,id==='listing'?'red':'green')}<h2>${p.name}</h2><p>${p.why}</p><div class="evidence"><div class="module-label">目前依据 · 模拟</div><p>${p.basis}</p></div><div class="actions">${btn('查看怎么做','plan',id,'primary')}</div><div class="foot">建议观察 ${p.days} 天 · ${state.decisions[id]?'已选过此方案':'由经营者决定是否采用'}</div></section>`}).join('')}</div>`}
function taskRows(group){return group.map(({t,i})=>`<div class="execution-task"><div>${pill(t.status,t.status==='已验收'?'green':t.status==='需补充'?'red':'amber')}${t.demo?pill('模拟执行单','mock'):''}<strong>${esc(t.title)}</strong><p>${esc(t.owner)} · ${esc(t.due)}${t.dueDate?' · 目标 '+esc(t.dueDate):''}</p><div class="task-progress"><span style="width:${t.checklist?.length?doneCount(t)/t.checklist.length*100:0}%"></span></div><div class="progress-label">已完成 ${doneCount(t)} / ${t.checklist?.length||0} 个具体步骤 · 需回传：${esc(t.proof||'执行记录')}</div></div>${btn('查看执行事项','task',String(i))}</div>`).join('')}
function tasks(){let groups=new Map;state.tasks.forEach((t,i)=>{let key=t.round||t.plan||'一句话安排';if(!groups.has(key))groups.set(key,[]);groups.get(key).push({t,i})});return header('事情进展','每个方案拆成具体事项。负责人逐项完成、回传材料，经营者再验收。',btn('去选方案','go','ideas','primary'))+`<div class="stat-line"><div class="status-count"><strong>${state.tasks.filter(t=>t.status==='待确认').length}</strong>待确认</div><div class="status-count"><strong>${state.tasks.filter(t=>['处理中','需补充'].includes(t.status)).length}</strong>处理中／需补充</div><div class="status-count"><strong>${state.tasks.filter(t=>t.status==='待验收').length}</strong>待验收</div><div class="status-count"><strong>${state.tasks.filter(t=>t.status==='已验收').length}</strong>已验收</div></div>${[...groups.entries()].reverse().map(([key,group])=>{let plan=group[0].t.plan,p=DEMO.plans[plan],finished=group.filter(x=>x.t.status==='已验收').length;return `<section class="card execution-plan"><div class="execution-plan-head"><div><div class="module-label">${group[0].t.demo?'示例执行单':'已选择的方案'}</div><h2>${p?.name||'经营者一句话安排'}</h2><p>${finished}/${group.length} 项已验收 · ${group.reduce((n,x)=>n+doneCount(x.t),0)}/${group.reduce((n,x)=>n+(x.t.checklist?.length||0),0)} 个步骤已完成</p></div>${pill(group[0].t.demo?'模拟演示':'本地任务','mock')}</div><div class="execution-list">${taskRows(group)}</div></section>`}).join('')}<div class="note">任务与反馈只保存在本浏览器，未发送给真实员工；示例执行单可直接点开体验。</div>`}
function review(){let chosen=Object.keys(state.decisions);return header('改完有没有用','先写清原来的问题、花了多少钱，再用相近的日子比较实际结果。',btn('去选一个方案','go','ideas','primary'))+`<section class="card"><div class="card-head"><h2>已选方案，等待复盘</h2>${pill('本浏览器保存')}</div>${chosen.length?chosen.map(id=>{let work=state.tasks.filter(t=>t.plan===id&&!t.demo),ready=work.length&&work.every(t=>t.status==='已验收');return `<div class="mini-row"><div><strong>${DEMO.plans[id].name}</strong><div class="tiny">${work.filter(t=>t.status==='已验收').length}/${work.length} 项已验收${ready?'，可以记录效果':'，先完成执行和验收'}</div></div>${ready?btn('填写实际结果','review-form',id):pill('待执行','amber')}</div>`}).join(''):'<div class="empty">先在“AI 出主意”里选择一个办法并安排执行。</div>'}</section><section class="card section-gap"><div class="card-head"><h2>我的改进记录</h2></div>${state.reviews.length?state.reviews.map((r,i)=>`<div class="mini-row"><div><strong>${esc(r.plan)}</strong><div class="tiny">原来：${esc(r.baseline)} · 后来：${esc(r.after)} · 费用：¥${fmt(r.cost)} · ${esc(r.date)}</div></div>${btn('看结论','review-detail',String(i))}</div>`).join(''):'<div class="empty">还没有复盘记录。执行后再记录实际结果。</div>'}</section><div class="note amber">对比必须考虑相同星期、天气、闭园、促销、可售状态与退款。观察到增长，也不能直接认定是 AI 建议带来的。</div>`}
function voice(){return header('客人怎么说','先把现场听到的事记下来，再结合订单和核验核查。少量反馈不代表全部游客。',btn('把反馈变成建议','plan','product','primary'))+`<div class="grid-3">${DEMO.feedback.map(f=>`<section class="card"><div class="card-head">${pill('模拟反馈','mock')}<span class="tiny">${f.date}</span></div><h2>${f.topic}</h2><p class="muted">${f.source} · ${f.count} 条</p><div class="note amber">这只是问题线索；需要核对完整样本、发生时间和对应服务状态。</div></section>`).join('')}</div><section class="card section-gap"><h2>正式接入后怎样收集</h2><div class="stat-line"><div>① 现场人员选问题类别与发生时间</div><div>② 记录来源与匿名数量</div><div>③ 关联营业和订单数据验证</div></div><div class="note">只记录必要的匿名信息。来自平台评价的游客只代表该平台的评论群体。</div></section>`}
function market(){return header('同行和新机会','用公开变化寻找灵感，再检查本景区是否有条件做。公开热度不等于销量。',btn('看小项目评估','plan','project','primary'))+`<div class="grid-3">${DEMO.competitors.map(x=>`<section class="card">${pill('模拟公开线索','mock')}<h2 style="margin:12px 0">${x.name}</h2><p>${x.seen}</p><div class="note">${x.question}</div><span class="tiny">模拟收集日期：${x.date}。不是实时监测。</span></section>`).join('')}<section class="card">${pill('适用条件','amber')}<h2 style="margin:12px 0">上新前先查五件事</h2><p>客群真需要吗？季节合适吗？场地和安全允许吗？人员够吗？投入能收回吗？</p>${btn('打开评估方案','plan','project','primary')}</section></div>`}
function staff(){let r=DEMO.roster;return header('员工在岗','先看关键岗位是否有人，异常信息要找现场负责人核实。',btn('处理未确认岗位','plan','staff','primary'))+`<div class="stat-line"><div class="status-count"><strong>${r.planned}</strong>计划在岗</div><div class="status-count"><strong>${r.present}</strong>已确认在岗</div><div class="status-count"><strong>${r.leave}</strong>请假</div><div class="status-count"><strong>${r.missing}</strong>未确认</div></div><section class="card"><div class="table-wrap"><table><thead><tr><th>岗位</th><th>计划</th><th>已确认</th><th>状态</th></tr></thead><tbody>${r.posts.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[1]===x[2]?pill('正常','green'):pill('需核实','amber')}</td></tr>`).join('')}</tbody></table></div><div class="note">排班和签到为模拟数据；缺口先核实是请假、换班还是漏打卡。</div></section>`}
function command(){return header('一句话安排','老板说目标，系统草拟管理层到基层的动作，再由负责人确认、反馈和验收。')+`<div class="two-col"><section class="card"><h2>说一件想办成的事</h2><p class="muted" style="margin:8px 0 15px">例如“明天有检查，准备好接待和安全巡查”。</p><label class="field">你的话<textarea id="command-text" placeholder="把要办的事说清楚"></textarea></label>${btn('生成执行安排','draft-command','','primary')}<div class="note">生成的任务仅在此演示浏览器中保存，不会自动发给员工。</div></section><section class="card"><h2>最近安排</h2>${state.commands.length?state.commands.slice().reverse().slice(0,5).map((c,i)=>`<div class="mini-row"><span>${esc(c.text)}</span>${pill(c.status,'amber')}</div>`).join(''):'<div class="empty">还没有安排，左边试一句。</div>'}</section></div>`}
function sources(){return header('数据从哪来','试点先用景区现有表格；缺失的价格、开放、投放和反馈先用标明的模拟记录展示。',btn('打开独立试点版 P2','pilot','','primary'))+`<div class="two-col"><div class="stack"><section class="card"><h2>当前可演示的数据</h2><div class="evidence-list">${[['订单与收款','售出日期、支付金额、渠道、票种'],['核验与退款','到访核验、项目使用、退款原因'],['园内消费与停车','收款流水、营业记录'],['排班与任务','在岗人数、问题负责人、反馈和验收']].map(x=>`<div class="evidence-item"><strong>${x[0]}</strong><small>${x[1]} · 当前示例为模拟</small></div>`).join('')}</div></section><section class="card"><h2>先从表格试一次</h2><p class="muted">独立试点版支持上传日报和流水，在浏览器内做字段映射、去重、口径核对，生成真实上传表格的看板。</p><div class="actions" style="margin-top:14px">${btn('打开表格试点版','pilot','','primary')}</div><div class="note">表格由你的浏览器处理；正式接入方式需与景区另行确定。</div></section></div><section class="card"><h2>还缺哪些资料</h2><div class="evidence-list">${[['渠道价格政策','每次价格生效日期、佣金、结算规则'],['产品是否可售','上架、库存、预约、项目开放记录'],['投放服务商报表','花费、曝光、点击、来源订单'],['一线游客反馈','匿名问题分类、发生时间和来源'],['天气与营业日','是否开园、天气、周末和节假日']].map(x=>`<div class="evidence-item"><strong>${x[0]}</strong><small>${x[1]} · 目前用模拟记录展示</small></div>`).join('')}</div><div class="note amber">接入前仅展示“可能的问题”，不把模拟原因写成真实景区结论。</div></section></div>`}
function render(){let v=nav.find(x=>x[0]===state.view)||nav[0];$('#nav').innerHTML=nav.map(([id,ico,name],j)=>`${j===8?'<div class="nav-divider"></div>':''}<a href="#${id}" class="${id===v[0]?'active':''}"><span class="nav-icon">${ico}</span>${name}</a>`).join('');$('#crumb').textContent=v[2];$('#site').value=state.site;$('#demo-banner').innerHTML=`${pill(state.uploaded?'部分真实表格':'全部模拟','mock')} ${state.uploaded?'本次上传的基础指标来自表格；问题、渠道、人员和建议依据仍为模拟。':'页面内经营数据、问题、人员、竞对与执行结果均为模拟演示。'} <a href="#sources">查看数据说明 →</a>`;$('#main').innerHTML=({home,board,issues,ideas,tasks,review,voice,market,staff,command,sources}[v[0]]||home)()}
function metricDetail(k){let m=metric(k),r=pct(m.now,m.prev),good=k==='refund'?r<0:r>0;let issue=DEMO.issues.find(x=>x.id===(k==='refund'?'refund':k==='paid'?'product':k==='orders'?'listing':k==='entry'?'staff':'ads'));drawer(`${DEMO.metrics[k].name}：${r==null?'缺少可比数据':r>=0?'增长':'下降'} ${r==null?'':Math.abs(r*100).toFixed(1)+'%'}`,`<div class="detail-grid"><div class="detail-stat">本期<strong>${fmt(m.now)}</strong>${DEMO.metrics[k].unit}</div><div class="detail-stat">可比日<strong>${fmt(m.prev)}</strong>${DEMO.metrics[k].unit}</div><div class="detail-stat">变化方向<strong class="${r>=0?'good':'attention'}">${r>=0?'增长':'下降'}</strong>${good?'有利线索':'需核查'}</div></div><div class="note">${DEMO.metrics[k].definition} ${state.uploaded&&m.source==='上传表格'?'该项来自本次上传，其余分析仍用模拟线索。':'此处数字为模拟。'} 变化颜色只表示方向，退款增长仍需关注。</div><div class="block"><h3>先查哪些原因</h3><ul class="bullets"><li>对比的两天是否都营业、同星期、天气和开放情况是否相近。</li><li>是否有票价、渠道上架、投放或项目开放变化。</li><li>订单、退款、核验的日期和统计口径是否一致。</li></ul></div><div class="block"><h3>给经营者的下一步建议</h3><p>${issue?.check||'先补齐来源与可比条件，再选小范围方案。'}</p></div><div class="drawer-actions">${btn('查看相关问题','issue',issue?.id||'product','primary')}${btn('看全部方案','go','ideas')}</div>`)}
function issueDetail(id){let i=DEMO.issues.find(x=>x.id===id);if(!i)return;drawer(i.title,`${pill('模拟问题线索','mock')}<div class="block"><h3>看到什么</h3><p>${i.signal}</p></div><div class="evidence-item"><strong>依据</strong><small>${i.source}。仅是模拟演示，真实项目需接入并核对相应数据。</small></div><div class="block"><h3>先确认</h3><p>${i.check}</p></div><div class="block"><h3>建议谁来负责</h3><p>${i.owner}</p></div><div class="drawer-actions">${btn('打开可执行方案','plan',i.plan,'primary')}${btn('查看数据看板','go','board')}</div>`)}
function planDetail(id){let p=DEMO.plans[id];if(!p)return;let work=EXECUTION[id]||[];drawer(p.name,`${pill(p.category,'green')}${pill('示例依据','mock')}<div class="block"><h3>为什么建议做</h3><p>${p.why}</p></div><div class="evidence-item"><strong>当前依据</strong><small>${p.basis}。该依据为模拟，真实景区要先核实。</small></div><div class="block"><h3>满足什么条件才做</h3><p>${p.condition}</p></div><div class="block"><h3>具体执行单 · ${work.length} 项工作</h3><p>选中方案后会把以下事项交给对应岗位。每项须逐步勾选、回传材料并通过验收。</p>${work.map((x,i)=>`<div class="task-preview"><div class="inline-meta">${pill('第 '+(i+1)+' 项','blue')}<span>${esc(x.owner)} · ${esc(x.due)}</span></div><h3>${esc(x.title)}</h3><ol class="bullets">${x.checklist.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="task-preview-footer"><strong>回传：</strong>${esc(x.proof)}<br><strong>验收：</strong>${esc(x.acceptance)}</div></div>`).join('')}</div><div class="block"><h3>预算和复盘</h3><p>${p.cost}；建议 ${p.days} 天后核对：${p.metric}。</p></div><div class="note amber"><strong>什么情况要停：</strong>${p.stop}</div><div class="drawer-actions">${btn(state.decisions[id]?'再安排一轮':'选这个办法并生成执行单','choose',id,'primary')}${btn('先看其他方案','go','ideas')}</div>`)}
function choose(id){let p=DEMO.plans[id],work=EXECUTION[id];if(!p||!work)return;let round=`${id}-${new Date().toISOString()}`;state.decisions[id]=new Date().toISOString();state.tasks=state.tasks.filter(t=>!t.demo);work.forEach((_,i)=>state.tasks.push(makeTask(id,i,round)));save();close();toast(`已生成 ${work.length} 项、共 ${work.reduce((n,x)=>n+x.checklist.length,0)} 个具体步骤`);go('tasks')}
function taskDetail(index){let t=state.tasks[Number(index)];if(!t)return;drawer(t.title,`${pill(t.status,t.status==='已验收'?'green':'amber')}${t.demo?pill('模拟执行单','mock'):''}<div class="detail-grid"><div class="detail-stat">负责人<strong style="font-size:16px">${esc(t.owner)}</strong></div><div class="detail-stat">约定时间<strong style="font-size:16px">${esc(t.due)}</strong></div><div class="detail-stat">已完成步骤<strong>${doneCount(t)}/${t.checklist.length}</strong></div></div><div class="form-grid"><label class="field">实际负责人<input id="task-owner" value="${esc(t.owner)}" maxlength="40"></label><label class="field">完成日期<input id="task-due" type="date" value="${esc(t.dueDate||'')}"></label></div><div class="block"><h3>具体要做的事</h3><div class="checklist">${t.checklist.map((x,i)=>`<label class="check-item ${t.done[i]?'checked':''}"><input type="checkbox" data-action="task-check" data-id="${index}" data-step="${i}" ${t.done[i]?'checked':''} ${t.status==='已验收'?'disabled':''}><span>${esc(x)}</span></label>`).join('')}</div></div><div class="evidence-item task-evidence"><strong>要回传什么</strong><span>${esc(t.proof)}</span></div><div class="evidence-item task-evidence"><strong>做到什么才算完成</strong><span>${esc(t.acceptance)}</span></div><label class="field task-evidence">执行反馈<textarea id="task-feedback" placeholder="写清实际做了什么、发现了什么问题">${esc(t.feedback||'')}</textarea></label><label class="field">回传材料或记录编号<input id="task-evidence" placeholder="例如：脱敏汇总表名、巡查记录编号" value="${esc(t.evidence||'')}"></label>${t.status==='待验收'||t.status==='已验收'||t.status==='需补充'?`<label class="field">经营者验收意见<textarea id="task-acceptance" placeholder="通过原因，或退回要求">${esc(t.acceptanceNote||'')}</textarea></label>`:''}<div class="note">勾选、反馈和验收仅保存在本浏览器。示例单不会通知任何员工。</div><div class="drawer-actions">${btn('保存进度','task-update',String(index))}<button class="btn primary" data-action="task-update" data-id="${index}" data-status="待验收">提交经营者验收</button>${t.status==='待验收'?`<button class="btn" data-action="task-update" data-id="${index}" data-status="已验收">验收通过</button><button class="btn danger" data-action="task-update" data-id="${index}" data-status="需补充">退回补充</button>`:''}</div>`)}
function taskUpdate(index,status){let t=state.tasks[Number(index)];if(!t)return;let owner=$('#task-owner')?.value.trim(),dueDate=$('#task-due')?.value,feedback=$('#task-feedback')?.value.trim()||'',evidence=$('#task-evidence')?.value.trim()||'',acceptanceNote=$('#task-acceptance')?.value.trim()||'';if(!owner||!dueDate){toast('请先确定实际负责人和完成日期');return}t.owner=owner;t.dueDate=dueDate;t.feedback=feedback;t.evidence=evidence;t.acceptanceNote=acceptanceNote;if(status==='待验收'&&(!t.done.every(Boolean)||!feedback||!evidence)){save();toast('先完成全部步骤，并填写反馈与回传材料');return}if(['已验收','需补充'].includes(status)&&(t.status!=='待验收'||!acceptanceNote)){toast('请在待验收状态写明验收意见');return}t.status=status||(t.status==='待确认'?'处理中':t.status);save();close();toast(status==='已验收'?'已验收：本地演示记录已更新':'执行进度已保存');render()}
function draftCommand(text){text=String(text||'').trim();if(!text){toast('先说清楚要办的事');return}let visit=/检查|视察|接待|领导/.test(text),steps=visit?[['管理层','明确来访时间、路线、接待负责人和完成时限'],['现场运营','检查沿线安全、卫生、设施和应急安排'],['班组长','把岗位任务分到人，逐项反馈照片或文字'],['经营者','收齐反馈，复查关键事项并验收']]:[['管理层','确认目标、时间、负责人和完成标准'],['部门负责人','拆出本部门要做的事和所需资源'],['班组长','分到具体岗位并记录执行反馈'],['经营者','核对结果与未完成事项']];drawer('一句话拆成执行安排',`<div class="note">原话：${esc(text)}</div><div class="timeline">${steps.map(([who,what])=>`<div><strong>${who}</strong><p>${what}</p></div>`).join('')}</div><div class="note amber">这是规则模板生成的草稿；时间、路线与责任人应由景区管理层确认。保存只写入当前浏览器。</div><div class="drawer-actions"><button class="btn primary" data-action="save-command" data-text="${esc(text)}" data-visit="${visit?'1':'0'}">确认并生成本地任务</button>${btn('返回修改','go','command')}</div>`)}
function saveCommand(text,visit){let steps=visit?[['管理层','确认来访信息与接待安排'],['现场运营','完成路线安全与设施检查'],['班组长','落实岗位并回报执行结果'],['经营者','复查并验收']]:[['管理层','确认目标和时限'],['部门负责人','分解本部门动作'],['班组长','落实岗位并回报'],['经营者','验收结果']];let c={text,status:'已生成演示任务',date:new Date().toISOString()},round=`一句话安排-${c.date}`;state.commands.push(c);steps.forEach(([owner,title])=>state.tasks.push({owner,title:`${text.slice(0,16)}：${title}`,status:'待确认',due:'由经营者确认',dueDate:localDate(1),feedback:'',evidence:'',acceptanceNote:'',checklist:visit?['确认具体时间、地点与联系人','完成本岗位要做的准备','向上级回报结果和未完成事项']:['确认目标、时限和负责人','完成本岗位具体动作','回报结果和卡点'],done:[false,false,false],proof:'执行记录或现场照片编号',acceptance:'经营者核对完成情况与未完成事项',command:true,round}));save();close();toast('已生成 4 项本地演示任务');go('tasks')}
function reviewDetail(index){let r=state.reviews[Number(index)];if(!r)return;drawer(r.plan,`<div class="detail-grid"><div class="detail-stat">原来<strong>${esc(r.baseline)}</strong></div><div class="detail-stat">后来<strong>${esc(r.after)}</strong></div><div class="detail-stat">费用<strong>¥${fmt(r.cost)}</strong></div></div><div class="note amber">${r.cost>0?'新增收入还须扣除成本、退款和渠道费用，并与可比日期或对照组核实。':'需继续观察实际贡献和服务影响。'} 本地填报的结果不能单独证明 AI 带来了增长。</div>`)}
function openReviewForm(id){let p=DEMO.plans[id];if(!p)return;drawer(`复盘：${p.name}`,`<form id="review-form"><input type="hidden" name="plan" value="${esc(p.name)}"><div class="form-grid"><label class="field">调整前是什么样<input name="baseline" required placeholder="例：同类日核验 260 人"></label><label class="field">调整后是什么样<input name="after" required placeholder="例：同类日核验 285 人"></label><label class="field">花了多少钱（元）<input name="cost" type="number" min="0" step="0.01" required value="0"></label><label class="field">对比条件<input name="context" required placeholder="天气、开园、周末是否相近"></label></div><div class="note">请填写真实执行记录。系统会保存本浏览器填写的内容，不自动归因。</div><button class="btn primary">保存复盘记录</button></form>`)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;if(a==='go'){close();go(id)}else if(a==='metric')metricDetail(id);else if(a==='issue')issueDetail(id);else if(a==='plan')planDetail(id);else if(a==='choose')choose(id);else if(a==='task')taskDetail(id);else if(a==='task-check'){let t=state.tasks[Number(id)],step=Number(b.dataset.step);if(t&&step>=0&&step<t.done.length&&t.status!=='已验收'){t.done[step]=b.checked;b.closest('.check-item').classList.toggle('checked',b.checked);$('#drawer-body .detail-stat:last-child strong').textContent=`${doneCount(t)}/${t.checklist.length}`;save()}}else if(a==='task-update')taskUpdate(id,b.dataset.status);else if(a==='filter'){state.planFilter=id;render()}else if(a==='quick-command')draftCommand($('#home-command')?.value);else if(a==='draft-command')draftCommand($('#command-text')?.value);else if(a==='save-command')saveCommand(b.dataset.text,b.dataset.visit==='1');else if(a==='review-detail')reviewDetail(id);else if(a==='review-form')openReviewForm(id);else if(a==='pilot')window.open('pilot.html','_blank','noopener')});
document.addEventListener('submit',e=>{if(e.target.id==='review-form'){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));state.reviews.push({...x,cost:Number(x.cost),date:new Date().toLocaleDateString('zh-CN')});save();close();toast('复盘记录已保存');go('review')}});
document.querySelector('#drawer').addEventListener('click',e=>{if(e.target.matches('[data-close]')||e.target.id==='drawer')close()});$('#menu').onclick=()=>document.body.classList.toggle('nav-open');$('#site').onchange=e=>{state.site=e.target.value;render()};window.addEventListener('hashchange',()=>{let v=location.hash.slice(1);if(v!==state.view)go(v)});hydrateTasks();render();
</script></body></html>
